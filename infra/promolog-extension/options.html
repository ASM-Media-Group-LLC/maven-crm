<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 460px; margin: 40px auto; padding: 0 20px; background: #0f1115; color: #e7e9ee; }
    h3 { font-size: 16px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 9px; border: 1px solid #2a2e39; border-radius: 8px; background: #171a21; color: #e7e9ee; box-sizing: border-box; }
    button { margin-top: 18px; padding: 9px 16px; border: 0; border-radius: 8px; background: #7c5cff; color: #fff; font-weight: 600; cursor: pointer; }
    #msg { margin-top: 10px; color: #4ade80; font-size: 13px; }
    p.hint { color: #b8bcc8; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <h3>⚙ Maven Promolog — Opciones</h3>
  <p class="hint">El <b>token</b> debe coincidir con el secret <code>PROMOLOG_EXT_TOKEN</code> que creaste en Supabase. Solo se guarda en este navegador.</p>
  <label>Maven URL</label>
  <input id="url" placeholder="https://lsagslbkliprespbyhts.supabase.co" />
  <label>Token de la extensión</label>
  <input id="token" type="password" placeholder="PROMOLOG_EXT_TOKEN" />
  <button id="save">Guardar</button>
  <p id="msg"></p>
  <script src="options.js"></script>
</body>
</html>
