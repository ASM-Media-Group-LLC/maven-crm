# LiveKit self-hosted (SFU) — servidor de medios para videollamadas de Maven
# (botón de video en Messenger) + Cowork. Reemplaza a LiveKit Cloud.
#
# Deploy: Dokploy > proyecto maven_v3 > Create Service > Compose (misma caja, VPS Contabo).
# - Señalización wss: se enruta por Traefik al puerto 7880 vía el tab "Domains" de Dokploy
#   (dominio lk.asmtech.ai, TLS Let's Encrypt automático). NO hace falta escribir labels a mano.
# - Media WebRTC (UDP/TCP): se publica directo en el host (abajo). Docker abre estos puertos
#   en iptables automáticamente (no requiere tocar el firewall del host).
services:
  livekit:
    # [SIN VERIFICAR el tag exacto] estable al 2026-07-03 = v1.13.3.
    # Confirmar en https://hub.docker.com/r/livekit/livekit-server/tags antes de deployar.
    image: livekit/livekit-server:v1.13.3
    restart: unless-stopped
    environment:
      # Formato: "APIxxxxxxxx: secretxxxxxxxx" (una línea key: secret).
      # Se setea en Dokploy > Environment (NO se commitea). Debe coincidir EXACTO
      # con los secrets LIVEKIT_API_KEY / LIVEKIT_API_SECRET de Supabase al hacer el cutover.
      LIVEKIT_KEYS: ${LIVEKIT_KEYS}
      # La config va INLINE, no por archivo montado, y no es cuestión de gusto:
      # un bind-mount de un solo archivo no cambia la definición del servicio,
      # así que `compose up -d` no recrea el contenedor y LiveKit —que lee su
      # config al bootear— se queda con la vieja mientras el deploy figura
      # "Done". Nos pasó con el webhook: hubo que reiniciar a mano. Acá la
      # config ES parte del servicio, así que cambiarla recrea el contenedor.
      #
      # ⚠️ La variable se llama LIVEKIT_CONFIG (verificado en el fuente de
      # v1.13.3: la bandera --config-body lee de LIVEKIT_CONFIG). NO es
      # LIVEKIT_CONFIG_BODY, aunque el egress de al lado use EGRESS_CONFIG_BODY.
      #
      # ⚠️ webhook.api_key TIENE que ser una de las de LIVEKIT_KEYS. Si no
      # coincide, LiveKit no arranca y se quedan sin videollamadas todos.
      LIVEKIT_CONFIG: |
        port: 7880                 # HTTP/WebSocket de señalización (Traefik enruta lk.asmtech.ai acá)
        rtc:
          tcp_port: 7881           # media TCP (fallback)
          udp_port: 7882           # media UDP: puerto ÚNICO multiplexado (más simple que un rango para Docker)
          use_external_ip: true    # anuncia la IP pública del VPS en los candidatos ICE — CLAVE para que conecte
        logging:
          level: info
        redis:                     # OBLIGATORIO para egress: ahí publica el server los trabajos de grabación
          address: redis:6379
        webhook:
          # LiveKit avisa apenas termina el egress y la grabación se cierra al
          # instante. El cron cerrar-grabaciones-huerfanas NO se saca: un
          # webhook que no llega no se reintenta, y sin esa red la grabación
          # quedaría abierta para siempre.
          api_key: APIfbcbe6d204c0
          urls:
            - https://lsagslbkliprespbyhts.supabase.co/functions/v1/livekit-webhook
    ports:
      - "7881:7881"        # media TCP (fallback cuando UDP está bloqueado)
      - "7882:7882/udp"    # media UDP (puerto único multiplexado)
      # Señalización SOLO en loopback del host: la usa egress (que corre en
      # red de host, ver abajo). No expone nada a internet.
      - "127.0.0.1:17880:7880"
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          # Techo para que un all-hands de 50 no ahogue a los otros ~20 contenedores
          # de la caja. La caja tiene 8 vCPU / 32 GB; dejamos hasta 4 cores / 3 GB a LiveKit.
          cpus: "4"
          memory: 3g

  # Coordina servidor <-> egress (obligatorio para grabar; el server solo
  # no lo necesitaba). Solo en la red interna, sin puertos al host.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Solo loopback del host, para el egress (red de host). Puerto raro a
      # propósito: 6379 pelado podría chocar con otro redis de la caja.
      - "127.0.0.1:16379:6379"
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 256m

  # Grabador: se une a la sala como participante invisible, compone la
  # vista (speaker layout) y escribe el MP4 al disco del VPS.
  egress:
    image: livekit/egress:v1.9
    restart: unless-stopped
    environment:
      # Config inline con sustitución de compose: las claves son las MISMAS
      # LIVEKIT_API_KEY/SECRET de los secrets de Supabase (se setean en
      # Dokploy > Environment de este compose, NO se commitean).
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:17880
        redis:
          address: 127.0.0.1:16379
        logging:
          level: info
        # Cuánta CPU "cobra" cada grabación al decidir si acepta el trabajo.
        # Por defecto RoomComposite cuesta 4 = UNA grabación a la vez con el
        # tope de abajo; las dos fallas "503 Service Unavailable" de la
        # semana del 05/09 fueron dos coordinadores de Cowork grabando a la
        # vez. Una grabación real consume 1,5-2,5 CPU, así que 2 es honesto.
        # Con tope 6 → hasta 3 grabaciones simultáneas.
        cpu_cost:
          room_composite_cpu_cost: 2
    volumes:
      # El disco del VPS, decisión de Jhon: viable SOLO porque el
      # vencimiento a 90 días no tiene excepciones (espacio acotado).
      - /var/lib/maven/grabaciones:/out
    # RED DE HOST, no negociable (21/08): en la red interna el egress entraba
    # a la sala (token OK) pero su Chrome intentaba la media contra el
    # candidato publico 147.93.3.97:7882 y el hairpin de Docker no cierra ->
    # "dtls timeout" en los tres data channels y el job aborta con "Start
    # signal not received". En red de host la media va directa. Es ademas el
    # despliegue recomendado por LiveKit para egress en la misma caja.
    network_mode: host
    depends_on:
      - redis
      - livekit
    deploy:
      resources:
        limits:
          # OJO: el egress acepta un trabajo solo si le queda CPU "libre"
          # según su costo (arriba, room_composite_cpu_cost: 2). Con menos
          # de ese costo se registra pero RECHAZA los trabajos y el server
          # responde 503 "no egress available" (pasó el 21/08 con cpus:3 y
          # costo 4). Es un TECHO, no reserva: en reposo consume ~0.
          #
          # 6 de las 8 CPU de la máquina: caben 3 grabaciones y quedan 2 para
          # LiveKit y el resto de Maven — el grabador NUNCA debe poder comerse
          # el audio de una llamada en vivo. Memoria a 4g porque cada
          # grabación es un Chrome componiendo (~1 GB cada uno).
          # PENDIENTE (Jhon): medir en Dokploy una mañana de Cowork con dos
          # grabaciones a la vez; si el egress roza las 6 CPU, la palanca
          # siguiente ya es máquina.
          cpus: "6"
          memory: 4g

  # Descargas firmadas + borrado de los MP4 (ver rec-server/rec-server.mjs).
  # Dominio en Dokploy: rec.asmtech.ai -> este contenedor :8080.
  #
  # El código va DENTRO de la imagen, no por bind-mount. Antes entraba montado
  # como un solo archivo y eso escondía una trampa cara: `compose up -d` no ve
  # ningún cambio en la definición del servicio, así que no recrea nada, y node
  # —que ya tenía el módulo en memoria— seguía sirviendo el código viejo con el
  # deploy en verde. Se perdió una hora depurando código que no corría.
  # Con el código en la imagen, tocarlo cambia la imagen y compose recrea.
  #
  # Igual conviene confirmar qué está sirviendo:
  #   curl -s https://rec.asmtech.ai/health   -> {"version":"...", ...}
  rec-server:
    build: ./rec-server
    restart: unless-stopped
    environment:
      RECORDINGS_SIGNING_SECRET: ${RECORDINGS_SIGNING_SECRET}
      RECORDINGS_DIR: /out
    volumes:
      - /var/lib/maven/grabaciones:/out
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  # Red de Dokploy (para que Traefik alcance el puerto 7880 de señalización).
  dokploy-network:
    external: true
