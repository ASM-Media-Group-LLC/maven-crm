# Config del servidor LiveKit self-hosted. Sin secrets (las keys van por env LIVEKIT_KEYS).
port: 7880                 # HTTP/WebSocket de señalización (Traefik enruta lk.asmtech.ai -> acá)
rtc:
  tcp_port: 7881           # media TCP (fallback)
  udp_port: 7882           # media UDP: puerto ÚNICO multiplexado (más simple que un rango para Docker)
  use_external_ip: true    # anuncia la IP pública del VPS en los candidatos ICE — CLAVE para que conecte
logging:
  level: info
# Redis: OBLIGATORIO para egress (el server publica ahí los trabajos de
# grabación). Solo red interna del compose.
redis:
  address: redis:6379
# keys: se inyectan por la variable de entorno LIVEKIT_KEYS (Dokploy), no van en este archivo.
#
# ─────────────────────────────────────────────────────────────────────────
# WEBHOOK DE GRABACIONES — ACTIVO desde el 29/08/2026.
#
# Qué hace: LiveKit avisa apenas termina un egress, y la grabación se cierra al
# instante en vez de esperar al sondeo. El endpoint verifica la firma y rechaza
# todo lo que no venga de acá.
#
# El sondeo (cron `cerrar-grabaciones-huerfanas`, cada 2 min) NO se saca: un
# webhook que no llega no se reintenta, y sin esa red la grabación quedaría
# abierta para siempre.
#
# ⚠️ DOS COSAS SI ALGUIEN TOCA ESTO:
#
# 1. `api_key` tiene que ser EXACTAMENTE una de las keys de LIVEKIT_KEYS
#    (Dokploy → livekit → Environment). Si no coincide, LIVEKIT NO ARRANCA y
#    eso deja sin videollamadas a todo el mundo. El valor de acá se verificó
#    contra el emisor (`iss`) de un token real antes de escribirlo.
#
# 2. Este archivo entra por bind-mount: desplegar NO alcanza. Hay que RECREAR
#    el contenedor de livekit, y eso corta las llamadas ~30 s. Hacerlo con
#    nadie trabajando.
webhook:
  api_key: APIfbcbe6d204c0
  urls:
    - https://lsagslbkliprespbyhts.supabase.co/functions/v1/livekit-webhook
# ─────────────────────────────────────────────────────────────────────────
# turn: (opcional, Slice 2) se activa solo si hay clientes detrás de NAT/firewall estricto que no conecten.
