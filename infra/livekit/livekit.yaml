# Config del servidor LiveKit self-hosted. Sin secrets (las keys van por env LIVEKIT_KEYS).
port: 7880                 # HTTP/WebSocket de señalización (Traefik enruta lk.asmtech.ai -> acá)
rtc:
  tcp_port: 7881           # media TCP (fallback)
  udp_port: 7882           # media UDP: puerto ÚNICO multiplexado (más simple que un rango para Docker)
  use_external_ip: true    # anuncia la IP pública del VPS en los candidatos ICE — CLAVE para que conecte
logging:
  level: info
# Redis: OBLIGATORIO para egress (el server publica ahí los trabajos de
# grabación). Solo red interna del compose.
redis:
  address: redis:6379
# keys: se inyectan por la variable de entorno LIVEKIT_KEYS (Dokploy), no van en este archivo.
#
# ─────────────────────────────────────────────────────────────────────────
# WEBHOOK DE GRABACIONES — PREPARADO, SIN ACTIVAR. Descomentar para activar.
#
# Qué gana: hoy una grabación que nadie detuvo se cierra por sondeo (cron
# `cerrar-grabaciones-huerfanas`, cada 2 min). Con esto, LiveKit AVISA en
# cuanto el egress termina y se cierra al instante. El endpoint ya está
# desplegado y verificado — rechaza todo lo que no venga firmado.
#
# El sondeo NO se saca: un webhook que no llega no se reintenta, y sin la
# red de seguridad la grabación quedaría abierta para siempre.
#
# ⚠️ DOS COSAS ANTES DE DESCOMENTAR:
#
# 1. `api_key` tiene que ser EXACTAMENTE la parte izquierda de LIVEKIT_KEYS
#    (Dokploy → livekit → Environment), la que empieza con "API". Si no
#    coincide con una key configurada, LIVEKIT NO ARRANCA — y eso deja sin
#    videollamadas a todo el mundo. No lo escribo yo porque no me consta el
#    valor, y equivocarlo es peor que no hacerlo.
#
# 2. Este archivo entra por bind-mount, así que desplegar NO alcanza: hay
#    que RECREAR el contenedor de livekit, y eso corta las llamadas ~30 s.
#    Hacerlo con nadie trabajando.
#
# webhook:
#   api_key: APIxxxxxxxx        # ← la parte izquierda de LIVEKIT_KEYS
#   urls:
#     - https://lsagslbkliprespbyhts.supabase.co/functions/v1/livekit-webhook
# ─────────────────────────────────────────────────────────────────────────
# turn: (opcional, Slice 2) se activa solo si hay clientes detrás de NAT/firewall estricto que no conecten.
