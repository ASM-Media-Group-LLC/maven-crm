<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Promolog Scanner</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --card:#1a1d24; --fg:#e8eaed; --mut:#9aa0aa; --line:#2a2e37; --ok:#2ecc71; --warn:#f1c40f; --bad:#e74c3c; --accent:#6c8cff;
          /* El log tenía el fondo #0b0d11 escrito a mano: en tema claro quedaba un
             rectángulo negro en medio de una página blanca. Ahora es token. */
          --code-bg:#0b0d11; --code-fg:#cbd2dc; }
  @media (prefers-color-scheme: light){ :root{ --bg:#f4f5f7; --card:#fff; --fg:#1a1d24; --mut:#667; --line:#e3e5e9; --code-bg:#f7f8fa; --code-fg:#2b3038; } }
  * { box-sizing:border-box; } body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; } header .sub { color:var(--mut); font-size:13px; }
  /* Identidad de la máquina: a la derecha, discreta, pero siempre visible. */
  header .ident { margin-left:auto; text-align:right; font-size:12.5px; }
  header .ident #agente { font-weight:600; }
  header .ident #version { font-variant-numeric:tabular-nums; font-size:12px; }
  header .ident.atrasada #version { color:var(--warn); }
  /* 960px alcanzaba cuando el panel era una lista. Con el log y los resultados lado
     a lado en el monitor de una Mac Mini, dejaba las dos columnas apretadas mientras
     sobraba pantalla a los costados. */
  main { max-width:1240px; margin:0 auto; padding:20px; }
  /* Ningún ancho de ventana debe hacer scrollear la página de costado: lo que se
     desborde scrollea DENTRO de su caja. */
  html, body { overflow-x:hidden; }
  .net { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .net > h2 { margin:0 0 4px; font-size:16px; display:flex; align-items:center; gap:8px; }
  .net .netsub { color:var(--mut); font-size:12.5px; margin-bottom:12px; }
  .accts { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin-bottom:12px; }
  .acct { border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .acct .top { display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .acct .name { font-weight:600; font-size:14px; display:flex; align-items:center; gap:7px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--mut); display:inline-block; }
  .dot.ok{ background:var(--ok); } .dot.bad{ background:var(--bad); } .dot.warn{ background:var(--warn); }
  /* Por qué falló el último "Ya me logueé". Va con franja roja al costado porque es
     la diferencia entre "guardé" y "creí que guardé", y hay que verla sin buscarla. */
  .loginerr{ margin-top:8px; padding:8px 10px; border-left:3px solid var(--bad);
             background:rgba(231,76,60,.12); border-radius:0 6px 6px 0; font-size:12.5px; line-height:1.45; }
  .muted { color:var(--mut); font-size:12.5px; }
  button { font:inherit; border:0; border-radius:9px; padding:8px 13px; cursor:pointer; background:var(--accent); color:#fff; font-size:13.5px; }
  button.secondary { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button.tiny { padding:4px 9px; font-size:12px; }
  button.ghost { background:transparent; color:var(--mut); border:0; padding:2px 6px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .netactions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  /* ⚠️ `min-width:0` NO es opcional. Un hijo de grid arranca con min-width:auto, o
     sea que NO puede achicarse por debajo del ancho de su contenido — aunque tenga
     overflow:auto. Las líneas largas del log inflaban su columna, el grid se hacía
     más ancho que `main`, y la tabla de resultados quedaba empujada fuera de la
     ventana: se veía la columna Cuenta y las otras dos cortadas.
     Se veía en la Mac Mini y no acá porque depende del ancho de la ventana. */
  .split { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; margin-top:16px; }
  .split > * { min-width:0; }
  /* En pantallas grandes el log necesita menos ancho que la tabla de resultados,
     que es la que se lee a un golpe de vista. */
  @media (min-width:1100px){ .split{ grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); } }
  @media (max-width:680px){ .split{ grid-template-columns:1fr; } .accts{ grid-template-columns:1fr; } }
  #log { background:var(--code-bg); color:var(--code-fg); border:1px solid var(--line); border-radius:12px; padding:12px; height:320px; overflow:auto; font:12.5px/1.5 ui-monospace,Menlo,monospace; white-space:pre-wrap; }

  /* ── Última corrida ────────────────────────────────────────────────────────
     Es lo primero que se mira al abrir el panel ("¿esto corrió? ¿cómo salió?"),
     así que va ARRIBA de las cuentas: resumen antes que detalle. La antigüedad
     se codifica en la FRANJA de la izquierda además de en el texto, para que se
     lea de un vistazo sin tener que interpretar "hace 9 h". */
  .ultima { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px;
            border-left:3px solid var(--line); background:color-mix(in srgb, var(--fg) 4%, transparent);
            border-radius:0 8px 8px 0; padding:8px 12px; margin-bottom:12px; font-size:13px; }
  .ultima.fresca { border-left-color:var(--ok); }
  .ultima.tibia  { border-left-color:var(--warn); }
  .ultima.vieja  { border-left-color:var(--bad); }
  .ultima .cuando { font-weight:600; }
  .ultima .stats { display:flex; flex-wrap:wrap; gap:10px; color:var(--mut); }
  /* tabular-nums: los números quedan alineados entre redes al comparar de un vistazo */
  .ultima .n { font-variant-numeric:tabular-nums; font-weight:600; color:var(--fg); }
  .ultima .n.si  { color:var(--ok); }
  .ultima .n.bad { color:var(--bad); }
  .ultima.sindatos { color:var(--mut); }

  /* ── Programación automática ───────────────────────────────────────────────
     Fila de controles, no tarjeta aparte: es una PROPIEDAD de la red, no otra
     sección. Apagada queda en gris y sin ruido; encendida se destaca sola. */
  .auto { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px;
          border:1px dashed var(--line); border-radius:10px; padding:8px 11px;
          margin-bottom:12px; font-size:13px; color:var(--mut); }
  .auto.on { border-style:solid; border-color:color-mix(in srgb, var(--ok) 45%, var(--line)); color:var(--fg); }
  .auto select, .auto input[type=time] { font:inherit; font-size:13px; padding:3px 6px; border-radius:7px;
          border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .auto .proxima { margin-left:auto; font-variant-numeric:tabular-nums; }
  /* El switch es un checkbox real: navegable con teclado y con foco visible. */
  .sw { position:relative; display:inline-block; width:36px; height:20px; flex:none; }
  .sw input { opacity:0; width:0; height:0; }
  .sw span { position:absolute; inset:0; background:var(--line); border-radius:20px; transition:background .15s; cursor:pointer; }
  .sw span::before { content:""; position:absolute; width:14px; height:14px; left:3px; top:3px;
          background:#fff; border-radius:50%; transition:transform .15s; }
  .sw input:checked + span { background:var(--ok); }
  .sw input:checked + span::before { transform:translateX(16px); }
  .sw input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ .sw span, .sw span::before { transition:none; } }
  /* `table-layout:fixed` + anchos explícitos: sin esto el navegador reparte según el
     contenido, y un handle largo (los de Facebook son URLs enteras) se comía las
     columnas Resultado e Items, que son justo las que se leen. */
  table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
  th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; }
  /* La cabecera queda fija: la lista scrollea y sin esto uno pierde de vista qué
     columna es cuál justo cuando hay muchos resultados, que es cuando importa. */
  thead th { position:sticky; top:-12px; background:var(--card); z-index:1; }
  /* Cuenta: se trunca con "…" y el nombre completo queda en el tooltip. Es preferible
     a que empuje al resto — el veredicto es lo que hay que poder leer de un vistazo. */
  td.cuenta { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  col.c-cuenta { width:38%; } col.c-items { width:64px; }
  td.items { text-align:right; font-variant-numeric:tabular-nums; color:var(--mut); }
  td.res { white-space:normal; }
  .pill { padding:2px 8px; border-radius:20px; font-size:12px; }
  .pill.historias,.pill.leido{ background:rgba(108,140,255,.16); color:var(--accent); }
  .pill.con_promo{ background:rgba(46,204,113,.2); color:var(--ok); font-weight:600; }
  .pill.sin_promo,.pill.sin_posts{ background:rgba(154,160,170,.16); color:var(--mut); }
  /* Ámbar: promocionó de verdad, pero no es hallazgo de HOY — ya estaba registrada. */
  .pill.ya_registrado{ background:rgba(241,196,15,.18); color:#f1c40f; font-weight:600; }
  .pill.pendiente,.pill.throttled,.pill.no_ig_id,.pill.sin_texto{ background:rgba(241,196,15,.16); color:var(--warn); }
  .pill.no_legible{ background:rgba(231,76,60,.18); color:var(--bad); }
  .results-wrap { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; max-height:320px; overflow:auto; }
  .badge { font-size:12px; padding:2px 8px; border-radius:20px; background:rgba(108,140,255,.16); color:var(--accent); }
</style>
</head>
<body>
<header>
  <span style="font-size:22px">📸</span>
  <div><h1>Promolog Scanner</h1><div class="sub">Tu red · cuentas por red · el scan se reparte entre las cuentas que agregues</div></div>
  <!-- Qué máquina y qué código. Con varias Mac Minis corriendo lo mismo, no saber
       cuál estás mirando (ni si quedó atrasada) es la primera fuente de confusión. -->
  <div class="ident">
    <div><span id="agente">—</span></div>
    <div class="row" style="gap:8px;justify-content:flex-end;margin-top:4px">
      <span id="version" class="muted" title="commit que sirve este panel">—</span>
      <button id="actualizar" class="tiny secondary">↻ Actualizar</button>
    </div>
  </div>
</header>
<main>
  <div id="warn" class="net" style="display:none;border-color:var(--bad)"></div>
  <div id="nets"></div>
  <div class="row" style="margin:6px 0 2px"><button id="stop" class="secondary" disabled>■ Detener</button><span id="runstate" class="muted"></span></div>

  <div class="split">
    <div><div class="muted" style="margin-bottom:6px">Progreso en vivo</div><div id="log"></div></div>
    <div><div class="muted" style="margin-bottom:6px">Resultados <span id="counts" class="badge">0</span></div>
      <div class="results-wrap"><table>
        <colgroup><col class="c-cuenta"><col><col class="c-items"></colgroup>
        <thead><tr><th>Cuenta</th><th>Resultado</th><th>Items</th></tr></thead>
        <tbody id="results"></tbody></table></div></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const netsEl = $("#nets"), logEl = $("#log"), resultsEl = $("#results");
const EMO = { instagram:"📸", telegram:"✈️", x:"𝕏", facebook:"f" };
const NOTE = {
  instagram:"cada cuenta lee su parte (residencial). Más cuentas = menos volumen c/u = menos ban.",
  telegram:"los canales públicos (@usuario) se leen sin cuenta; los privados (link de invitación) solo si la cuenta logueada es miembro.",
  x:"cada cuenta logueada navega su parte de los perfiles. ⚠️ X bloquea el login automatizado (mete un control anti-bot que no avanza): logueate en Chrome normal, cerralo, y corré <code>node import-session.mjs x</code>.",
  facebook:"lee el muro de cada página con una cuenta logueada. Reemplaza el scan por Apify, que hoy corre 6 veces al día.",
};
let LOGIN = {};    // "network:id" → "open"
let LOGINERR = {}; // "network:id" → por qué falló el último intento de guardar

function fmtCd(ts){ if(!ts) return ""; const m=Math.max(0,Math.round((ts-Date.now())/60000)); return `cooldown ${m}min`; }

// "hace 12 min" / "hace 3 h" / "ayer 21:40". Relativo hasta el día, porque lo que
// importa es la ANTIGÜEDAD ("¿esto está fresco?"), no la hora exacta.
function haceCuanto(iso){
  const t = Date.parse(iso); if(!Number.isFinite(t)) return { txt:"—", horas:Infinity };
  const min = Math.max(0, Math.round((Date.now()-t)/60000));
  const horas = min/60;
  const hora = new Date(t).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",hour12:false});
  if (min < 1)  return { txt:"recién", horas };
  if (min < 60) return { txt:`hace ${min} min`, horas };
  if (horas < 24) return { txt:`hace ${Math.round(horas)} h · ${hora}`, horas };
  const dias = Math.round(horas/24);
  return { txt: dias === 1 ? `ayer ${hora}` : `hace ${dias} días`, horas };
}

// Franja de la última corrida. Sin datos NO se oculta: "nunca corrió" es
// justamente lo que hay que ver (fue el caso del agente local de IG el 01/08).
function ultimaCorrida(u){
  if (!u) return `<div class="ultima sindatos">Sin corridas registradas todavía</div>`;
  const { txt, horas } = haceCuanto(u.cuando);
  const clase = horas < 3 ? "fresca" : horas < 14 ? "tibia" : "vieja";
  const r = u.resumen || {};
  const stat = (n, label, cls="") =>
    (n === undefined || n === null) ? "" : `<span><span class="n ${cls}">${n}</span> ${label}</span>`;
  const stats = [
    stat(r.con_promo, "con promo", "si"),
    stat(r.sin_promo, "sin promo"),
    stat(r.leidos_sin_posts, "sin posts"),
    stat(r.no_legibles, "no legibles", r.no_legibles > 0 ? "bad" : ""),
  ].filter(Boolean).join("");
  // Sin resumen (corridas del server) igual se muestran las entradas creadas: es
  // preferible un dato pobre a una franja vacía que parece un error.
  const fallback = stats ? "" : stat(u.entradas, "entradas guardadas");
  return `<div class="ultima ${clase}" title="${new Date(u.cuando).toLocaleString("es-CO")}">
    <span class="cuando">${txt}</span>
    <span class="muted">${u.origen ?? ""}</span>
    <span class="stats">${stats || fallback || '<span class="muted">sin resumen</span>'}</span>
  </div>`;
}

// Controles de corrida automática. `intervalos` viene del server para no tener
// la lista duplicada en dos archivos.
function bloqueAuto(net, intervalos){
  const p = net.programacion || {};
  const on = !!p.activo;
  const opts = (intervalos||[1,2,3,4,6,8,12,24]).map(h =>
    `<option value="${h}" ${Number(p.cada_horas)===h?"selected":""}>cada ${h} h</option>`).join("");
  // Con el reloj apagado, mostrar "próxima" sería mentira; se muestra solo si corre.
  const prox = on && p.proxima
    ? `<span class="proxima">próxima ${new Date(p.proxima).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",hour12:false})}</span>`
    : "";
  return `<div class="auto ${on?"on":""}">
    <label class="sw"><input type="checkbox" data-auto="${net.network}" ${on?"checked":""}
      aria-label="Corridas automáticas de ${net.label}"><span></span></label>
    <span>Automático</span>
    <select data-cada="${net.network}" ${on?"":"disabled"}>${opts}</select>
    <span>entre</span>
    <input type="time" data-desde="${net.network}" value="${p.desde||"06:00"}" ${on?"":"disabled"}>
    <span>y</span>
    <input type="time" data-hasta="${net.network}" value="${p.hasta||"23:59"}" ${on?"":"disabled"}>
    ${prox}
  </div>`;
}

function render(st){
  $("#agente").textContent = st.agente || "—";
  const v = st.version || {};
  const dias = v.fecha ? Math.floor((Date.now() - new Date(v.fecha)) / 86400000) : null;
  $("#version").textContent = v.commit && v.commit !== "?"
    ? `${v.commit}${dias === null ? "" : dias === 0 ? " · hoy" : ` · hace ${dias}d`}` : "sin git";
  // Se marca en ámbar a partir de 2 días: no es un error, pero con 5 máquinas es
  // la pista de que ésta se quedó atrás del resto.
  $(".ident").classList.toggle("atrasada", dias !== null && dias >= 2);
  $("#warn").style.display = (st.token_ok && st.cron_ok) ? "none" : "block";
  $("#warn").textContent = !st.token_ok ? "⚠️ Falta PROMOLOG_EXT_TOKEN en el .env." : (!st.cron_ok ? "⚠️ Falta CRON_INTERNAL_TOKEN (lo usan Telegram y X)." : "");
  const busy = st.running;
  netsEl.innerHTML = st.networks.map(net => {
    const accts = net.accounts.map(a => {
      const cls = a.cooldown_until ? "warn" : (a.logged_in ? "ok" : "bad");
      // "sin login" y "archivo sin sesión" son distintos: el segundo significa que
      // se guardó algo que NO tiene la cookie de la red (típico de apretar "ya me
      // logueé" antes de tiempo). Decirlos igual es lo que hizo creer que X estaba lista.
      const estado = a.cooldown_until ? fmtCd(a.cooldown_until)
        : (a.logged_in ? "sesión lista" : (a.sesion_vacia ? "archivo guardado, pero SIN sesión" : "sin login"));
      const key = net.network+":"+a.id;
      const loginBtn = LOGIN[key]==="open"
        ? `<button class="tiny" data-save="${key}">✓ Ya me logueé</button>`
        : `<button class="tiny secondary" data-login="${key}">${a.logged_in?"Re-loguear":"Loguear"}</button>`;
      const rm = net.accounts.length>1 ? `<button class="ghost" title="quitar" data-remove="${key}">✕</button>` : "";
      const hint = LOGINERR[key]
        ? `<div class="loginerr">${LOGINERR[key]}</div>`
        : (LOGIN[key]==="open" ? `<div class="muted" style="margin-top:6px">Logueate en la ventana${net.network==="telegram"?" (escaneá el QR)":""} y apretá “Ya me logueé”.</div>` : "");
      return `<div class="acct"><div class="top"><span class="name"><span class="dot ${cls}"></span>${a.id}</span>${rm}</div>
        <div class="muted" style="margin:4px 0 8px">${estado}</div><div class="row">${loginBtn}</div>${hint}</div>`;
    }).join("");
    return `<div class="net"><h2>${EMO[net.network]} ${net.label} <span class="muted" style="font-weight:400">· ${net.accounts.length} cuenta(s)</span></h2>
      <div class="netsub">${NOTE[net.network]}</div>
      ${ultimaCorrida(net.ultima_corrida)}
      ${bloqueAuto(net, st.intervalos)}
      <div class="accts">${accts}</div>
      <div class="netactions">
        <button data-scan="${net.network}" ${busy?"disabled":""}>▶︎ Escanear ${net.label}</button>
        <button class="secondary" data-add="${net.network}">＋ Agregar cuenta</button>
        ${net.network==="telegram" ? `<span style="width:1px;height:22px;background:var(--line)"></span>
        <button class="secondary" data-tgcheck="1" ${busy?"disabled":""} title="Mira en cuáles de los canales privados ya está metida la cuenta. No se une a nada.">🔎 ¿En qué canales estoy?</button>
        <button class="secondary" data-tgjoin="1" ${busy?"disabled":""} title="Se une a los canales privados que falten, de a 4 por vez.">🚪 Unirme a los que faltan</button>` : ""}
        ${net.network==="facebook" ? `<span style="width:1px;height:22px;background:var(--line)"></span>
        <button class="secondary" data-fbcheck="1" ${busy?"disabled":""} title="Mira cuáles cuentas ya se pueden leer y cuáles no. No toca nada.">🔎 ¿A cuáles llego?</button>
        <button class="secondary" data-fbfollow="1" ${busy?"disabled":""} title="Sigue las páginas que falten. Es pasivo: la creadora no recibe ninguna notificación.">➕ Seguir las páginas</button>
        <button class="secondary" data-fbamistad="1" ${busy?"disabled":""} title="Manda solicitud de amistad a los perfiles personales. OJO: le llega a la creadora con el nombre y la foto de la cuenta.">📨 Mandar solicitud de amistad</button>` : ""}
      </div></div>`;
  }).join("");
  $("#stop").disabled = !busy;
  $("#runstate").textContent = busy ? "escaneando…" : "";
}
const LABEL = { con_promo:"✅ SÍ promocionó", sin_promo:"no promocionó", ya_registrado:"↩️ ya registrada (de antes)", leido:"leído", historias:"leído", sin_posts:"sin posts en 24h", sin_texto:"🖼️ posteó, pero sin texto", no_legible:"🔒 no se pudo leer", pendiente:"pendiente", throttled:"limitado por la red", no_ig_id:"handle no resuelve" };
function addResult(r){
  const tr=document.createElement("tr");
  const txt = LABEL[r.outcome] ?? r.outcome.replace("_"," ");
  // `cuando` = fecha del post. Va SIEMPRE que venga: sin ella, una promo de anoche
  // releída hoy se lee como hallazgo de hoy y parece que promolog perdió la entrada.
  const cuando = r.cuando ? `<div class="muted" style="font-size:11px">${r.cuando}</div>` : "";
  // El MOTIVO de un "no se pudo leer" es la mitad del dato: "no la seguimos" se
  // arregla siguiéndola y "el handle no existe" se corrige en Maven. Sin mostrarlo,
  // todos los ilegibles se leen igual y no se sabe qué hacer con ninguno.
  const motivo = r.motivo ? `<div class="muted" style="font-size:11px">${r.motivo.replace(/_/g," ")}</div>` : "";
  // title = el handle completo: la celda se trunca, pero el dato no se pierde.
  tr.innerHTML=`<td class="cuenta" title="@${r.handle}">@${r.handle}</td><td class="res"><span class="pill ${r.outcome}">${txt}</span>${cuando}${motivo}</td><td class="items">${r.stories??""}</td>`;
  // el veredicto final (con_promo/sin_promo/ya_registrado) reemplaza la fila previa del mismo handle
  if (r.outcome==="con_promo" || r.outcome==="sin_promo" || r.outcome==="ya_registrado") {
    const prev=[...resultsEl.children].find(x=>x.firstChild.textContent==="@"+r.handle);
    if (prev) { prev.replaceWith(tr); $("#counts").textContent=resultsEl.children.length; return; }
  }
  resultsEl.prepend(tr); $("#counts").textContent=resultsEl.children.length;
}
function addLog(m){ logEl.textContent+=m+"\n"; logEl.scrollTop=logEl.scrollHeight; }

const es = new EventSource("/api/stream");
es.addEventListener("status", e => render(JSON.parse(e.data)));
es.addEventListener("log", e => addLog(JSON.parse(e.data).msg));
es.addEventListener("result", e => addResult(JSON.parse(e.data)));

async function post(url, body){ const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}); return r.json().catch(()=>({})); }
async function refresh(){ render(await (await fetch("/api/status")).json()); }

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if (d.add){ await post(`/api/account/${d.add}/add`); await refresh(); }
  else if (d.remove){ const [n,id]=d.remove.split(":"); await post(`/api/account/${n}/remove`,{id}); await refresh(); }
  else if (d.login){ LOGIN[d.login]="open"; const [n,id]=d.login.split(":"); await post(`/api/login/${n}/${id}/open`); await refresh(); }
  // Guardar puede FALLAR (no hay sesión en el navegador todavía). Antes se ignoraba
  // la respuesta y se cerraba el flujo igual → parecía que había guardado. Si falla,
  // el login sigue abierto y el motivo se muestra en la tarjeta.
  else if (d.save){
    const [n,id]=d.save.split(":");
    const r = await post(`/api/login/${n}/${id}/save`);
    if (r.ok){ LOGIN[d.save]=null; delete LOGINERR[d.save]; }
    else { LOGINERR[d.save] = r.error || "no se pudo guardar la sesión"; }
    await refresh();
  }
  else if (d.scan){ resultsEl.innerHTML=""; $("#counts").textContent=0; await post(`/api/scan/${d.scan}`); }
  else if (d.fbcheck){ await post("/api/fb-follow", { seguir:false }); }
  else if (d.fbfollow){ await post("/api/fb-follow", { seguir:true, amistad:false, max:6 }); }
  // La solicitud de amistad le llega a la creadora con nombre y foto de la cuenta
  // scanner. Se confirma a mano: es la única acción del panel que ve otra persona.
  else if (d.fbamistad){
    if (!confirm("Se le va a mandar SOLICITUD DE AMISTAD a los perfiles personales.\n\nA la creadora le llega una notificación con el nombre y la foto de la cuenta scanner, y tiene que aceptarla.\n\n¿Seguimos?")) return;
    await post("/api/fb-follow", { seguir:true, amistad:true, max:6 });
  }
  else if (d.tgcheck){ await post("/api/tg-join", { join:false }); }
  // De a 4 por tanda: unirse a muchos canales seguidos es lo que dispara el límite
  // de Telegram, y esta cuenta es la única que ve los canales privados.
  else if (d.tgjoin){ await post("/api/tg-join", { join:true, max:4 }); }
  else if (t.id==="stop"){ await post("/api/stop"); }
  else if (t.id==="actualizar"){
    t.disabled = true; t.textContent = "actualizando…";
    const r = await post("/api/actualizar");
    if (!r.ok){ addLog("⚠️ " + (r.error||"no se pudo actualizar") + (r.detalle ? "\n" + r.detalle : "")); }
    else if (!r.cambio){ addLog("✓ ya estaba al día (" + r.commit + ")"); }
    else if (r.reinicia){ addLog(`✓ actualizado a ${r.commit} (${r.commits} commit/s). Reiniciando…`); esperarReinicio(); return; }
    else { addLog(`✓ actualizado a ${r.commit} (${r.commits} commit/s). CERRÁ Y VOLVÉ A ABRIR el panel para que tome el código nuevo.`); }
    t.disabled = false; t.textContent = "↻ Actualizar"; await refresh();
  }
});

// Tras un reinicio por launchd el server tarda un par de segundos en volver. En vez
// de dejar la página muerta, se sondea hasta que responde y se recarga sola.
async function esperarReinicio(){
  for (let i=0; i<30; i++){
    await new Promise(r=>setTimeout(r,1000));
    try { const r = await fetch("/api/status",{cache:"no-store"}); if (r.ok){ location.reload(); return; } } catch {}
  }
  addLog("⚠️ El agente no volvió solo. Revisá logs/agente.error.log");
}

// Programación automática. Va por "change" y no por "click" porque son selects e
// inputs; el switch entra igual (un checkbox emite change).
document.addEventListener("change", async (e) => {
  const d = e.target.dataset || {};
  const red = d.auto || d.cada || d.desde || d.hasta;
  if (!red) return;
  const patch = d.auto   ? { activo: e.target.checked }
              : d.cada   ? { cada_horas: Number(e.target.value) }
              : d.desde  ? { desde: e.target.value }
              :            { hasta: e.target.value };
  await post(`/api/schedule/${red}`, patch);
  await refresh();
});
</script>
