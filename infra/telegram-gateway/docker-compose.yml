# Maven Telegram Gateway — compose para Dokploy.
#
# Lee canales de Telegram (MTProto/GramJS) para la verificacion de promos de
# Promolog. Login por web en /manager; la sesion se guarda en un volumen Docker
# (sobrevive reinicios) — igual que el baileys-gateway con su auth state.
#
# DEPLOY EN DOKPLOY
# -------------------------------------------
# Provider = Git, repo maven-crm, branch main,
# Compose Path = infra/telegram-gateway/docker-compose.yml.
#
# ENV VARS REQUERIDAS EN DOKPLOY (tab Environment):
#   TELEGRAM_GW_API_KEY  -- apikey de las APIs hacia Maven (inventala; va tambien
#                           como secreto en las edge functions despues)
#   MANAGER_PASSWORD     -- contrasena del login del dashboard /manager
#   TELEGRAM_API_ID      -- de https://my.telegram.org
#   TELEGRAM_API_HASH    -- idem
#
# POST-DEPLOY:
#   1. Esperar healthy (~30s).
#   2. Abrir https://<dominio-del-micro>/manager  (usar nip.io o subdominio propio,
#      NO traefik.me — leccion del cloudphone-gateway).
#   3. Login con MANAGER_PASSWORD -> logueas la cuenta de Telegram (telefono ->
#      codigo -> 2FA). La sesion queda guardada en el volumen.
#   4. Probar un canal desde el mismo /manager (campo "Probar un canal").

version: "3.8"

services:
  telegram-gateway:
    build: .
    container_name: maven-telegram-gw
    restart: unless-stopped
    environment:
      API_KEY: ${TELEGRAM_GW_API_KEY}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      AUTH_DIR: /data
      INGEST_URL: ${INGEST_URL}        # edge telegram-ingest (bandeja S2)
      INGEST_TOKEN: ${INGEST_TOKEN}    # token compartido con telegram-ingest
    expose:
      - "8091"
    volumes:
      - telegram-session:/data
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  telegram-session:
    name: maven-telegram-session

networks:
  dokploy-network:
    external: true
