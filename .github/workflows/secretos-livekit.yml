name: Secretos LiveKit (cutover/rollback)

# Cambia las llaves de LiveKit en los secretos de Supabase para el cutover al
# servidor dedicado de llamadas (195.26.254.111 / lk.asmtech.ai), o las vuelve
# a las viejas si hay que revertir.
#
# POR QUÉ UN WORKFLOW: el SUPABASE_ACCESS_TOKEN vive solo en los secretos de
# GitHub (no hay CLI local autenticada), así que el cambio de secretos corre
# aquí. Las llaves nuevas también van como secretos del repo
# (LIVEKIT_API_KEY_NUEVA / LIVEKIT_API_SECRET_NUEVA): nunca pasan por logs.
#
# - `cutover`: respalda las llaves actuales como *_VIEJA (dentro de los mismos
#   secretos de Supabase) y activa las nuevas. Con eso el rollback es posible.
# - `rollback`: vuelve a poner las *_VIEJA como activas.
#
# El DNS (lk.asmtech.ai → IP nueva) se cambia aparte, en GoDaddy; este workflow
# solo mueve las llaves. Los secretos se propagan solos a las edge functions,
# sin redeploy.

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'cutover = activar llaves nuevas (respalda las viejas) · rollback = volver a las viejas'
        type: choice
        options:
          - cutover
          - rollback
        required: true

concurrency:
  group: secretos-livekit
  cancel-in-progress: false

jobs:
  secretos:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lsagslbkliprespbyhts
    steps:
      - name: Guard — falta SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN en el repo."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinneada por lo mismo que en deploy-edge-functions.yml: reproducible
          # y sin depender de resolver "latest" contra la API de GitHub.
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cutover — activar llaves nuevas
        if: inputs.accion == 'cutover'
        env:
          KEY_NUEVA: ${{ secrets.LIVEKIT_API_KEY_NUEVA }}
          SECRET_NUEVO: ${{ secrets.LIVEKIT_API_SECRET_NUEVA }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_NUEVA:-}" ] || [ -z "${SECRET_NUEVO:-}" ]; then
            echo "::error::Faltan LIVEKIT_API_KEY_NUEVA / LIVEKIT_API_SECRET_NUEVA en los secretos del repo."
            exit 1
          fi
          # Respaldo de las llaves actuales como *_VIEJA, para poder revertir.
          # OJO: nada de `echo $RESP` — trae valores de secretos.
          RESP="$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" || true)"
          VIEJA_KEY="$(printf '%s' "$RESP" | jq -r '.[] | select(.name=="LIVEKIT_API_KEY") | .value // empty' 2>/dev/null || true)"
          VIEJA_SEC="$(printf '%s' "$RESP" | jq -r '.[] | select(.name=="LIVEKIT_API_SECRET") | .value // empty' 2>/dev/null || true)"
          if [ -n "$VIEJA_KEY" ] && [ -n "$VIEJA_SEC" ]; then
            supabase secrets set "LIVEKIT_API_KEY_VIEJA=$VIEJA_KEY" "LIVEKIT_API_SECRET_VIEJA=$VIEJA_SEC" --project-ref "$PROJECT_REF"
            echo "Respaldo guardado como LIVEKIT_API_*_VIEJA en Supabase."
          else
            echo "::warning::No pude leer los valores viejos (la API no los devolvió) — el rollback de llaves por esta vía NO queda disponible."
          fi
          supabase secrets set "LIVEKIT_API_KEY=$KEY_NUEVA" "LIVEKIT_API_SECRET=$SECRET_NUEVO" --project-ref "$PROJECT_REF"
          echo "Llaves NUEVAS activas. Las edge functions las toman solas (sin redeploy)."

      - name: Rollback — volver a las llaves viejas
        if: inputs.accion == 'rollback'
        run: |
          set -euo pipefail
          RESP="$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets")"
          VIEJA_KEY="$(printf '%s' "$RESP" | jq -r '.[] | select(.name=="LIVEKIT_API_KEY_VIEJA") | .value // empty')"
          VIEJA_SEC="$(printf '%s' "$RESP" | jq -r '.[] | select(.name=="LIVEKIT_API_SECRET_VIEJA") | .value // empty')"
          if [ -z "$VIEJA_KEY" ] || [ -z "$VIEJA_SEC" ]; then
            echo "::error::No hay respaldo *_VIEJA en Supabase para volver. El rollback de llaves hay que hacerlo con los valores del Dokploy viejo."
            exit 1
          fi
          supabase secrets set "LIVEKIT_API_KEY=$VIEJA_KEY" "LIVEKIT_API_SECRET=$VIEJA_SEC" --project-ref "$PROJECT_REF"
          echo "Rollback hecho: llaves viejas activas otra vez. Recuerda volver también el DNS en GoDaddy."
