name: Secretos de la Oficina (editor nuevo)

# 16/11/2026: el servidor donde vivía el editor de la Oficina (ONLYOFFICE,
# 217.216.95.7) dejó de ser de Maven: ahí ahora corre otra cosa y Documentos,
# Hojas de cálculo y Presentaciones dejaron de abrir. El editor se levantó en
# el servidor de ASM (195.26.254.111, /opt/maven-oficina) detrás de su Caddy.
#
# Este workflow apunta la edge oficina-doc al editor nuevo:
#   · ONLYOFFICE_URL        → la dirección nueva
#   · ONLYOFFICE_JWT_SECRET → la firma del editor nuevo, que viene del secreto
#                             del repo ONLYOFFICE_JWT_SECRET_NUEVO (nunca pasa
#                             por logs). Las de antes quedan como *_VIEJO.
#
# Mismo patrón que secretos-livekit.yml: el SUPABASE_ACCESS_TOKEN vive solo en
# GitHub. Corre al empujar la rama oficina-editor-nuevo o a mano.

on:
  push:
    branches: [oficina-editor-nuevo]
    paths: [.github/workflows/secretos-oficina.yml]
  workflow_dispatch:

concurrency:
  group: secretos-oficina
  cancel-in-progress: false

jobs:
  secretos:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lsagslbkliprespbyhts
      URL_NUEVA: https://oficina.195-26-254-111.nip.io
    steps:
      - uses: actions/checkout@v4

      - name: Guard — faltan secretos
        env:
          JWT_NUEVO: ${{ secrets.ONLYOFFICE_JWT_SECRET_NUEVO }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "::error::Falta SUPABASE_ACCESS_TOKEN."; exit 1; fi
          if [ -z "${JWT_NUEVO:-}" ]; then echo "::error::Falta ONLYOFFICE_JWT_SECRET_NUEVO en los secretos del repo."; exit 1; fi

      - name: Guard — el editor nuevo responde
        run: |
          r="$(curl -s --max-time 20 "$URL_NUEVA/healthcheck" || true)"
          if [ "$r" != "true" ]; then echo "::error::El editor nuevo no responde en $URL_NUEVA ($r)."; exit 1; fi
          echo "Editor nuevo sano."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apuntar la Oficina al editor nuevo (respaldando lo de antes)
        env:
          JWT_NUEVO: ${{ secrets.ONLYOFFICE_JWT_SECRET_NUEVO }}
        run: |
          set -euo pipefail
          # OJO: nada de `echo $RESP` — trae valores de secretos.
          RESP="$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" || true)"
          URL_VIEJA="$(printf '%s' "$RESP" | jq -r '.[] | select(.name=="ONLYOFFICE_URL") | .value // empty' 2>/dev/null || true)"
          JWT_VIEJO="$(printf '%s' "$RESP" | jq -r '.[] | select(.name=="ONLYOFFICE_JWT_SECRET") | .value // empty' 2>/dev/null || true)"
          if [ -n "$URL_VIEJA" ] && [ -n "$JWT_VIEJO" ]; then
            supabase secrets set "ONLYOFFICE_URL_VIEJO=$URL_VIEJA" "ONLYOFFICE_JWT_SECRET_VIEJO=$JWT_VIEJO" --project-ref "$PROJECT_REF"
            echo "Respaldo guardado como *_VIEJO."
          else
            echo "::warning::La API no devolvió los valores de antes; no queda respaldo."
          fi
          supabase secrets set "ONLYOFFICE_URL=$URL_NUEVA" "ONLYOFFICE_JWT_SECRET=$JWT_NUEVO" --project-ref "$PROJECT_REF"
          echo "La Oficina apunta al editor nuevo."

      - name: Redesplegar oficina-doc (para que lea los secretos nuevos)
        run: supabase functions deploy oficina-doc --project-ref "$PROJECT_REF"
