name: Guard Edge Functions

# La MISMA guarda que corre deploy-edge-functions.yml antes de desplegar, pero en
# cada PR. Sin esto la guarda recién corría después del merge: un PR que la rompía
# se mergeaba igual y dejaba TODAS las edge functions sin poder desplegarse —
# incluidos los arreglos urgentes— hasta que alguien arreglara el test.
# Solo lee el código: no despliega nada ni necesita secretos.

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "infra/nas-drive/**"
      - ".github/workflows/deploy-edge-functions.yml"
      - ".github/workflows/guard-edge-functions.yml"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Guard — aislamiento entre agencias
        run: deno test --allow-read --no-check supabase/functions/public-api/ supabase/functions/manage-api-keys/ supabase/functions/messenger-webhooks/

      # La salida de los webhooks: que un timbre no pueda pegarle a Maven ni a una
      # red interna, que no lleve contenido de mensajes, la firma con el vector
      # oficial de Standard Webhooks. Con tipos (sin --no-check): el archivo los pasa.
      - name: Guard — salida de los webhooks
        run: deno test --allow-read supabase/functions/_shared/webhook-salida.test.ts

      # Mover un correo tiene que decir ADÓNDE fue a parar (COPYUID), para que
      # la caché lo traslade en vez de borrarlo, y no dejar pasar un Message-ID
      # con comillas o saltos de línea a un comando IMAP. Y la respuesta que
      # usa «Deshacer» (mail-fetch/destino.ts): solo pares de lo pedido, nunca
      # dos correos atados al mismo uid de destino.
      - name: Guard — mover correos (IMAP)
        run: deno test --no-check supabase/functions/_shared/imap-mover.test.ts supabase/functions/mail-fetch/destino.test.ts

      # Drive: Maven y el NAS tienen que firmar IGUAL (vector compartido con
      # infra/nas-drive), y las reglas de subida (tope, partes, nombres).
      - name: Guard — Drive (firma y subidas)
        run: deno test --no-check supabase/functions/_shared/drive-firma.test.ts supabase/functions/drive/logica.test.ts

      # Un archivo del Drive en ONLYOFFICE (oficina-doc): la vista es solo
      # lectura, la llave de caché es estable, la copia editable sale en
      # docx/xlsx/pptx, y la firma HS256 es la estándar (vector de jwt.io).
      - name: Guard — Drive en la Oficina (visor y copia editable)
        run: deno test --no-check supabase/functions/oficina-doc/drive.test.ts supabase/functions/oficina-doc/jwt.test.ts

      # El lado del NAS (infra/nas-drive, Node): el servidor, el índice diario
      # (paginado: arma el árbol en la mini) y el importador del archivo de Google
      # (enlaces duros en el mismo disco, ids estables, nombres del Mac a NFC).
      - name: Guard — Drive del NAS (servidor, índice e importador)
        run: node --test infra/nas-drive/test.mjs infra/nas-drive/indice.test.mjs infra/nas-drive/importar.test.mjs

      # La IA por OpenRouter (desde el 01/10/2026 no hay llave de Anthropic): el bucle de
      # herramientas de Clari, el catálogo sin additionalProperties (Gemini lo rechaza),
      # el JSON del análisis de QA y la herramienta forzada de la Parrilla. Sin red:
      # fetch es un doble que responde como OpenRouter (el catálogo sí baja sus imports).
      # Y «Traducir» del Correo (mail-fetch): el HTML a texto con sus saltos de línea, el
      # tope, que un error no devuelva la llave y que la acción lea solo filas de quien llama.
      - name: Guard — IA por OpenRouter
        run: deno test --no-check -A supabase/functions/ai-orchestrator/openrouter.test.ts supabase/functions/qa-analyze/openrouter.test.ts supabase/functions/parrilla-generate/ia.test.ts supabase/functions/mail-fetch/traducir.test.ts

      # Cowork por agencia: todo id que nombra un pedido a cowork-session (sesión, salas,
      # meet, pedidos) tiene que ser de la agencia de quien llama y de ESA sesión; antes y
      # después de la migración 20261001213000. También lee index.ts: la guarda corre una
      # vez antes de toda acción y toda acción con requestId está clasificada. Con tipos.
      - name: Guard — Cowork por agencia (cowork-session)
        run: deno test --allow-read supabase/functions/cowork-session/agencia.test.ts

      # Meet, llamadas, grabaciones y LiveKit por agencia (entrega 3c): la guarda
      # _shared/livekit-agencia.ts sabe de qué agencia es cada sala (cowork_, meet_,
      # call-) antes y después de la migración 20261003120000, y el test lee los
      # index.ts: livekit-token, livekit-moderate, meet-room, meet-guest y recordings
      # la corren antes de actuar, y stop ya no deja elegir destinatarios a cualquiera.
      # Con tipos.
      - name: Guard — Meet y LiveKit por agencia (livekit-agencia)
        run: deno test --allow-read supabase/functions/_shared/livekit-agencia.test.ts

      # Las cinco edges de llamadas, con tipos (antes ninguna corría deno check).
      - name: Tipos — edges de llamadas (LiveKit, Meet, grabaciones)
        run: >-
          deno check
          supabase/functions/livekit-token/index.ts
          supabase/functions/livekit-moderate/index.ts
          supabase/functions/meet-room/index.ts
          supabase/functions/meet-guest/index.ts
          supabase/functions/recordings/index.ts

      # web-push: el título, el cuerpo y a quién le llega el push del Messenger
      # (_shared/push-notify.ts) y quién aparece como emisor (web-push/nombre-emisor.ts:
      # ahí va a entrar el nombre visible de la key cuando se escriba por API). Con
      # tipos. Los tests no importan web-push/index.ts, que arranca el servidor al
      # importarse; nombre-emisor.test.ts sí lo LEE, para que la función probada sea
      # la que de verdad arma el push.
      - name: Guard — web-push
        run: deno test --allow-read supabase/functions/web-push/ supabase/functions/_shared/push-notify.test.ts

      # El buzón de Zoho de una cuenta dada de baja se borra al PURGARLA (a los 30
      # días), no al suspenderla (Jhon, 05/10): la decisión (corp@unlok.me nunca, la
      # cuenta recuperada no se toca, toda salida con su motivo), que la baja no toque
      # Zoho, que la purga encole el buzón antes de app_purge_user_refs, y la
      # paginación de listAccounts. Con tipos las tres edges que lo usan.
      - name: Guard — buzones de Zoho al purgar
        run: deno test --allow-read --allow-env --no-check supabase/functions/_shared/buzon-por-borrar.test.ts supabase/functions/_shared/zoho.test.ts

      - name: Tipos — bajas de cuentas y buzones de Zoho
        run: >-
          deno check
          supabase/functions/admin-user-actions/index.ts
          supabase/functions/buzones-por-borrar/index.ts
          supabase/functions/zoho-provision/index.ts
          supabase/functions/_shared/buzon-por-borrar.test.ts

      # La misma regla en la base (20261005120100), contra PGlite y las migraciones
      # reales de la papelera: la purga del cron encola el buzón antes de destruir,
      # una purga que falla no deja nada a medias, el cron solo llama si hay algo
      # vencido, nada lo llama anon/authenticated, y la vuelta atrás deja la purga
      # con la huella exacta de prod.
      - name: Banco — buzones de Zoho al purgar (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/buzones_por_borrar.ts

      # Las acciones de webhooks de manage-api-keys: el guard de arriba las corre sin
      # tipos; aquí el tipo de cada mensaje (clave que existe, variables) y de Datos.
      - name: Tipos — manage-api-keys
        run: >-
          deno check
          supabase/functions/manage-api-keys/index.ts
          supabase/functions/manage-api-keys/webhooks.test.ts
          supabase/functions/manage-api-keys/mensajes.test.ts
          supabase/functions/manage-api-keys/escritura.test.ts

      # El despachador de timbres, con tipos (las acciones y clases de los logs son
      # uniones cerradas; y lineaDeLog además limpia en tiempo de ejecución).
      - name: Tipos — messenger-webhooks
        run: >-
          deno check
          supabase/functions/messenger-webhooks/index.ts
          supabase/functions/messenger-webhooks/despachador.test.ts
          supabase/functions/messenger-webhooks/feed.test.ts
          supabase/functions/messenger-webhooks/estructura.test.ts
          supabase/functions/messenger-webhooks/datos.test.ts
          supabase/functions/messenger-webhooks/token.test.ts
          supabase/functions/messenger-webhooks/carreras.test.ts

      # El banco contra la migración real (PGlite): las reglas de la base y lo que
      # escriben manage-api-keys y el despachador, con los triggers de verdad. Solo en
      # el PR (baja PGlite de npm); en el deploy no.
      - name: Banco — tablas de los webhooks (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/api_webhooks_tablas.ts

      # El Messenger por agencia y sus huecos, sobre el esquema de PROD del 28/09
      # (supabase/tests/fixtures, con sus huellas): cada hueco A–H tiene que abrirse
      # sin la migración y cerrarse con ella, y los flujos de la app seguir andando.
      - name: Banco — el Messenger por agencia y sus huecos (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/chat_agencia_y_huecos.ts

      # Los avisos de sistema («Ana agregó a Beto al grupo») los arma la base: sobre
      # el mismo fixture, un aviso con texto libre tiene que entrar sin la migración
      # y no entrar con ella; los siete eventos de la RPC dan el texto exacto que
      # escribía la app, y avisa exactamente quien puede hacer la acción.
      - name: Banco — los avisos de sistema del Messenger (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/chat_mensajes_de_sistema.ts

      # La base de la escritura del Messenger por API (PR 2), sobre los dos fixtures de
      # prod (28/09 y 01/10) y la cadena real: la pared en la base (la key del claim
      # mvk, el cerco de la sesión fabricada, service_role sin INSERT), los cupos, la
      # idempotencia, el freno, la retirada, la vuelta atrás y 18 mutantes.
      - name: Banco — la escritura del Messenger por API (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/api_messenger_escritura.ts

      # La escritura de PUNTA A PUNTA (PR 4): el public-api de verdad (su Deno.serve
      # capturado, sin red) contra la misma base, con supabase-js en el medio y un
      # PostgREST mínimo que verifica el JWT y corre con su rol y sus claims. Prueba que
      # el token del edge (mvf + mvk) es el que la base reconoce, que las RPC y sus
      # parámetros son los de la migración y que cada código de la base sale bien por HTTP.
      - name: Banco — la escritura de punta a punta, edge + base (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/api_messenger_escritura_edge.ts

      # La base de las agencias, sobre el mismo esquema de PROD: una persona en una
      # sola agencia, el alta que ya no cae sola en asm-tech y el super admin. Cada
      # prueba tiene su línea base contra prod de hoy (tiene que poder fallar).
      - name: Banco — la base de las agencias (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/agencias_base.ts

      # Los roles por agencia, sobre el catálogo de PROD del 01/10 (fixtures/prod_roles_20261001.sql,
      # con las huellas de las 56 funciones): con una agencia da lo mismo que prod persona por
      # persona; con dos, cada hueco se prueba abierto en prod y cerrado con la migración.
      - name: Banco — los roles por agencia (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/roles_por_agencia.ts

      # Las personas por agencia, sobre los fixtures de PROD (Messenger 28/09 y API 01/10):
      # los perfiles, el «Para» del Correo y el karma, cada uno abierto en prod y cerrado
      # con las migraciones; con una agencia, cada persona ve lo mismo que en prod.
      - name: Banco — las personas por agencia (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/personas_por_agencia.ts

      # Cowork por agencia, sobre el catálogo de PROD del 01/10 (roles + fixtures/prod_cowork_20261001.sql,
      # con las huellas de las 21 funciones de Cowork): con una agencia cada persona ve lo mismo que
      # en prod (11 funciones, 13 tablas, 8 salas); con dos, cada cosa se prueba abierta en prod y
      # cerrada con la migración.
      - name: Banco — Cowork por agencia (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/cowork_por_agencia.ts

      # Meet, llamadas y grabaciones por agencia, sobre el catálogo de PROD del 01/10
      # (roles + Cowork + fixtures/prod_meet_20261001.sql, con las huellas de sus 7
      # funciones): con una agencia cada persona ve lo mismo que en prod (9 tablas, la
      # vista de uso, 9 salas); con dos, cada hueco (M1–M3, L1–L3, G1–G4) se prueba
      # abierto en prod y cerrado con la migración; la guarda de las edges dice lo
      # mismo que agencia_de_sala_livekit; la vuelta atrás deja todo como en prod.
      - name: Banco — Meet, llamadas y grabaciones por agencia (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/meet_por_agencia.ts

      # Drive (03/10): quién mandó cada cosa a la papelera (trigger propio, antes
      # que drive_items_cuidar) y el tamaño de las carpetas (drive_tamano_carpeta
      # y drive_tamanos), sobre las migraciones reales del Drive: lo importado sin
      # dueño se ve en la papelera de quien tiene la unidad, nadie de afuera mide
      # nada, y la vuelta atrás deja la tabla como estaba.
      - name: Banco — Drive, papelera y tamaños (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/drive_papelera_y_detalles.ts

      # Drive (03/10): el buscador rápido (drive_buscar arma primero lo que la
      # persona ve y elige el camino según cuántas fichas tienen las palabras)
      # da lo mismo que una referencia a lo bruto por todos los caminos, sin
      # dejar ver nada que drive_mi_rol no deje; y la papelera ya no cambia
      # «Última modificación». ~30 s.
      - name: Banco — Drive, buscador y fecha de la papelera (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/drive_buscar_y_fecha.ts

      # Creadoras por agencia, cuentas externas y avisos (05/10), sobre el catálogo de
      # PROD (roles 01/10 + fixtures/prod_creadoras_20261005.sql, con las huellas de sus
      # 42 funciones y 3 vistas): con una agencia cada persona ve lo mismo que en prod
      # (tabla, v_creators y 10 funciones); con dos, cada hueco se prueba abierto en prod
      # y cerrado con las migraciones (tabla, vistas, funciones, escrituras por las
      # vistas, la cuenta de creadora sin rol, los avisos a otra agencia o con enlaces de
      # afuera); la vuelta atrás deja todo como en prod. ~5 s.
      - name: Banco — creadoras por agencia, cuentas externas y avisos (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/creadoras_por_agencia.ts

      # Antes del portal de creadoras (05/10): creator-video (quién ve, sube,
      # confirma y borra videos de onboarding: la creadora es la de la fila,
      # nunca la del cuerpo) y send-notification-email (desde el navegador solo
      # { plantilla, id }, a cuentas de la misma agencia, con tope y sin devolver
      # correos; el modo servidor igual que siempre). Con tipos.
      - name: Guard — creator-video y send-notification-email
        run: deno test --allow-read supabase/functions/creator-video/logica.test.ts supabase/functions/send-notification-email/logica.test.ts

      - name: Tipos — creator-video y send-notification-email
        run: >-
          deno check
          supabase/functions/creator-video/index.ts
          supabase/functions/send-notification-email/index.ts

      # Las tres migraciones de esos huecos sobre los roles de PROD: la edición de
      # una creadora con la política de UPDATE de creators (FOR KEY SHARE, sin
      # copiarla), el bucket custom-requests por pedido (leer si lo ves, subir si
      # lo editas) con el flujo de Personalizados, y las RPC del correo (misma
      # agencia, 5 por minuto). Cada hueco abierto sin la migración y cerrado con
      # ella; la vuelta atrás; con una política distinta de la revisada, no corre.
      - name: Banco — videos de creadoras, archivos de Personalizados y correos (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/seguridad_archivos.ts

      # Portal de creadoras, fase 1 (06/10): creadora_cuentas (solo cuentas de creadora,
      # la agencia sale de la ficha, el correo solo enmascarado, nadie la escribe desde
      # el navegador), la ficha que ella edita (las 22 columnas y nada más, solo texto,
      # solo la suya) y el historial (cada columna anota quién y qué; cada agencia ve el
      # suyo y desde el navegador no se cambia ni se borra: en prod, sí). ~5 s.
      - name: Banco — portal de creadoras, cuentas y ficha (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/portal_creadoras.ts

      # portal-creadoras (la agencia da y quita el acceso): solo alguien del equipo que
      # ve a la creadora y tiene «Invitar al portal»; nunca ata el correo de alguien del
      # equipo; la misma cuenta en dos agencias; quitar bloquea sin borrar; los correos,
      # escapados y de tú. Con tipos.
      - name: Guard — portal-creadoras
        run: deno test --allow-read supabase/functions/portal-creadoras/logica.test.ts

      - name: Tipos — portal-creadoras
        run: deno check supabase/functions/portal-creadoras/index.ts

      # Portal de creadoras, fase 2 (06/10): la carpeta de contenido de cada creadora es
      # una unidad del Drive de su agencia. Quién del equipo la abre (drive_mi_rol: ve a la
      # creadora y tiene «Ver y descargar su contenido»; en prod nadie la abría), el Drive
      # de siempre igual para todos (64 casos contra prod), lector sin escritura, el
      # espacio de la agencia y la vuelta atrás. ~10 s.
      - name: Banco — portal de creadoras, su contenido en el Drive (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/portal_contenido.ts

      # La agencia de cada creadora, por agencia (06/10): Kash se llama Kash y elige entre
      # Kash Plus, Kash Massive y Atomick (con su compañía y su tier); otra agencia no ve
      # ninguna (su nombre fijo); nadie las escribe desde el navegador; vuelta atrás. ~5 s.
      - name: Banco — la agencia de cada creadora (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/agencia_lineas.ts

      # portal-contenido (ella y su carpeta): solo su ficha y lo de SU carpeta; borrar lo
      # suyo hasta 24 h, primero en el NAS; partes de 8 MB firmadas; el recibo del NAS.
      - name: Guard — portal-contenido
        run: deno test --allow-read supabase/functions/portal-contenido/logica.test.ts

      - name: Tipos — portal-contenido
        run: deno check supabase/functions/portal-contenido/index.ts

      # `deno test --no-check` no mira tipos: sin este paso, el tipo de msg() (clave que
      # existe, variables exactas) y los @ts-expect-error de mensajes.test.ts nunca
      # podrían fallar en CI. messenger.test.ts queda afuera: arrastra un error de tipos
      # anterior (línea 247) que no es de este cambio.
      - name: Tipos — public-api
        run: >-
          deno check
          supabase/functions/public-api/index.ts
          supabase/functions/public-api/aislamiento.test.ts
          supabase/functions/public-api/como-usuario.test.ts
          supabase/functions/public-api/mensajes.test.ts
          supabase/functions/public-api/peticion.test.ts
          supabase/functions/public-api/recursos-como-usuario.test.ts
          supabase/functions/public-api/escritura-formato.test.ts
