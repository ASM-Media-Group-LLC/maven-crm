name: Guard Edge Functions

# La MISMA guarda que corre deploy-edge-functions.yml antes de desplegar, pero en
# cada PR. Sin esto la guarda recién corría después del merge: un PR que la rompía
# se mergeaba igual y dejaba TODAS las edge functions sin poder desplegarse —
# incluidos los arreglos urgentes— hasta que alguien arreglara el test.
# Solo lee el código: no despliega nada ni necesita secretos.

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/deploy-edge-functions.yml"
      - ".github/workflows/guard-edge-functions.yml"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Guard — aislamiento entre agencias
        run: deno test --allow-read --no-check supabase/functions/public-api/ supabase/functions/manage-api-keys/ supabase/functions/messenger-webhooks/

      # La salida de los webhooks: que un timbre no pueda pegarle a Maven ni a una
      # red interna, que no lleve contenido de mensajes, la firma con el vector
      # oficial de Standard Webhooks. Con tipos (sin --no-check): el archivo los pasa.
      - name: Guard — salida de los webhooks
        run: deno test --allow-read supabase/functions/_shared/webhook-salida.test.ts

      # Mover un correo tiene que decir ADÓNDE fue a parar (COPYUID), para que
      # la caché lo traslade en vez de borrarlo, y no dejar pasar un Message-ID
      # con comillas o saltos de línea a un comando IMAP.
      - name: Guard — mover correos (IMAP)
        run: deno test --no-check supabase/functions/_shared/imap-mover.test.ts

      # Drive: Maven y el NAS tienen que firmar IGUAL (vector compartido con
      # infra/nas-drive), y las reglas de subida (tope, partes, nombres).
      - name: Guard — Drive (firma y subidas)
        run: deno test --no-check supabase/functions/_shared/drive-firma.test.ts supabase/functions/drive/logica.test.ts

      # web-push: el título, el cuerpo y a quién le llega el push del Messenger
      # (_shared/push-notify.ts) y quién aparece como emisor (web-push/nombre-emisor.ts:
      # ahí va a entrar el nombre visible de la key cuando se escriba por API). Con
      # tipos. Los tests no importan web-push/index.ts, que arranca el servidor al
      # importarse; nombre-emisor.test.ts sí lo LEE, para que la función probada sea
      # la que de verdad arma el push.
      - name: Guard — web-push
        run: deno test --allow-read supabase/functions/web-push/ supabase/functions/_shared/push-notify.test.ts

      # Las acciones de webhooks de manage-api-keys: el guard de arriba las corre sin
      # tipos; acá el tipo de cada mensaje (clave que existe, variables) y de Datos.
      - name: Tipos — manage-api-keys
        run: >-
          deno check
          supabase/functions/manage-api-keys/index.ts
          supabase/functions/manage-api-keys/webhooks.test.ts
          supabase/functions/manage-api-keys/mensajes.test.ts

      # El despachador de timbres, con tipos (las acciones y clases de los logs son
      # uniones cerradas; y lineaDeLog además limpia en tiempo de ejecución).
      - name: Tipos — messenger-webhooks
        run: >-
          deno check
          supabase/functions/messenger-webhooks/index.ts
          supabase/functions/messenger-webhooks/despachador.test.ts
          supabase/functions/messenger-webhooks/feed.test.ts
          supabase/functions/messenger-webhooks/estructura.test.ts
          supabase/functions/messenger-webhooks/datos.test.ts
          supabase/functions/messenger-webhooks/token.test.ts
          supabase/functions/messenger-webhooks/carreras.test.ts

      # El banco contra la migración real (PGlite): las reglas de la base y lo que
      # escriben manage-api-keys y el despachador, con los triggers de verdad. Solo en
      # el PR (baja PGlite de npm); en el deploy no.
      - name: Banco — tablas de los webhooks (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/api_webhooks_tablas.ts

      # El Messenger por agencia y sus huecos, sobre el esquema de PROD del 28/09
      # (supabase/tests/fixtures, con sus huellas): cada hueco A–H tiene que abrirse
      # sin la migración y cerrarse con ella, y los flujos de la app seguir andando.
      - name: Banco — el Messenger por agencia y sus huecos (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/chat_agencia_y_huecos.ts

      # La base de las agencias, sobre el mismo esquema de PROD: una persona en una
      # sola agencia, el alta que ya no cae sola en asm-tech y el super admin. Cada
      # prueba tiene su línea base contra prod de hoy (tiene que poder fallar).
      - name: Banco — la base de las agencias (PGlite)
        run: deno run -A --node-modules-dir=none --no-lock supabase/tests/agencias_base.ts

      # `deno test --no-check` no mira tipos: sin este paso, el tipo de msg() (clave que
      # existe, variables exactas) y los @ts-expect-error de mensajes.test.ts nunca
      # podrían fallar en CI. messenger.test.ts queda afuera: arrastra un error de tipos
      # anterior (línea 247) que no es de este cambio.
      - name: Tipos — public-api
        run: >-
          deno check
          supabase/functions/public-api/index.ts
          supabase/functions/public-api/aislamiento.test.ts
          supabase/functions/public-api/como-usuario.test.ts
          supabase/functions/public-api/mensajes.test.ts
          supabase/functions/public-api/peticion.test.ts
          supabase/functions/public-api/recursos-como-usuario.test.ts
