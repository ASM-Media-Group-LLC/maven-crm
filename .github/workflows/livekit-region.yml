name: LiveKit — servidor de llamadas (Miami / St. Louis)

# Mueve las llamadas de Maven entre servidores cambiando el secreto LIVEKIT_URL
# de Supabase (lo leen livekit-token y las demás funciones; se propaga solo).
# Las llaves son las mismas en los dos servidores, así que solo cambia la URL.
#
# Decisión de Alvaro (19/11/2026): pasar a Miami a las 6:00 a. m. de Colombia, y
# si en la primera hora sale peor que St. Louis (más conexiones malas o más
# ping), volver solo a St. Louis.
#   · 11:00 UTC (6:00 Bogotá)  → miami
#   · 12:00 y 13:00 UTC        → revisar: si Miami sale peor que ayer en St. Louis, vuelve
# También se puede correr a mano: destino = miami | stlouis | revisar.

on:
  schedule:
    - cron: '0 11 19 11 *'
    - cron: '0 12,13 19 11 *'
  workflow_dispatch:
    inputs:
      destino:
        description: 'miami | stlouis | revisar'
        type: choice
        options: [miami, stlouis, revisar]
        required: true

concurrency:
  group: livekit-region
  cancel-in-progress: false

jobs:
  mover:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lsagslbkliprespbyhts
      URL_MIAMI: wss://45-32-172-118.sslip.io
      URL_STLOUIS: wss://lk.asmtech.ai
    steps:
      - name: Qué toca
        id: que
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "accion=${{ inputs.destino }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 19 11 *" ]; then
            echo "accion=miami" >> "$GITHUB_OUTPUT"
          else
            echo "accion=revisar" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard — token
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "::error::Falta SUPABASE_ACCESS_TOKEN"; exit 1; fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: URL vigente (no es secreta)
        run: |
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            | jq -r '.[] | select(.name=="LIVEKIT_URL") | "LIVEKIT_URL vigente: " + (.value // "(la API no devuelve el valor)")' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Revisar Miami contra St. Louis (ayer, misma hora)
        id: revisar
        if: steps.que.outputs.accion == 'revisar'
        run: |
          set -euo pipefail
          SQL=$(cat <<'Q'
          with ahora as (
            select count(*) n,
                   100.0 * avg((datos->>'calidad' in ('poor','lost'))::int) mala,
                   percentile_cont(0.5) within group (order by nullif((datos->>'rtt_ms')::numeric,0)) rtt
              from llamada_salud where creado > now() - interval '50 minutes'),
          base as (
            select count(*) n,
                   100.0 * avg((datos->>'calidad' in ('poor','lost'))::int) mala,
                   percentile_cont(0.5) within group (order by nullif((datos->>'rtt_ms')::numeric,0)) rtt
              from llamada_salud where creado between now() - interval '1 day 50 minutes' and now() - interval '1 day')
          select json_build_object('n', a.n, 'mala', round(a.mala,2), 'rtt', a.rtt,
                                   'n_base', b.n, 'mala_base', round(b.mala,2), 'rtt_base', b.rtt) from ahora a, base b
          Q
          )
          R=$(curl -sf -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
               "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
               -d "$(jq -n --arg q "$SQL" '{query:$q}')")
          echo "$R"
          J=$(echo "$R" | jq -c '.[0].json_build_object')
          N=$(echo "$J" | jq '.n'); NB=$(echo "$J" | jq '.n_base')
          MALA=$(echo "$J" | jq '.mala // 0'); MALAB=$(echo "$J" | jq '.mala_base // 0')
          RTT=$(echo "$J" | jq '.rtt // 0'); RTTB=$(echo "$J" | jq '.rtt_base // 0')
          PEOR=$(jq -n --argjson n "$N" --argjson nb "$NB" --argjson m "$MALA" --argjson mb "$MALAB" --argjson r "$RTT" --argjson rb "$RTTB" \
            'if $n < 200 or $nb < 200 then false else ($m > ($mb * 1.5 + 1)) or ($rb > 0 and $r > $rb * 1.2) end')
          echo "Miami: $N muestras, mala $MALA %, ping $RTT ms · St. Louis ayer: $NB muestras, mala $MALAB %, ping $RTTB ms → peor=$PEOR"
          echo "peor=$PEOR" >> "$GITHUB_OUTPUT"
          {
            echo "### Revisión Miami vs St. Louis"
            echo "- Miami (últimos 50 min): $N muestras, conexión mala $MALA %, ping $RTT ms"
            echo "- St. Louis (ayer, misma hora): $NB muestras, conexión mala $MALAB %, ping $RTTB ms"
            echo "- ¿Peor? $PEOR"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cambiar LIVEKIT_URL
        if: steps.que.outputs.accion == 'miami' || steps.que.outputs.accion == 'stlouis' || steps.revisar.outputs.peor == 'true'
        run: |
          set -euo pipefail
          A="${{ steps.que.outputs.accion }}"
          if [ "$A" = "miami" ]; then URL="$URL_MIAMI"; else URL="$URL_STLOUIS"; fi
          supabase secrets set "LIVEKIT_URL=$URL" --project-ref "$PROJECT_REF"
          echo "LIVEKIT_URL → $URL" | tee -a "$GITHUB_STEP_SUMMARY"
