name: LiveKit — servidor de llamadas (Miami / St. Louis)

# Mueve las llamadas de Maven entre servidores cambiando el secreto LIVEKIT_URL
# de Supabase (lo leen livekit-token y las demás funciones; se propaga solo).
# Las llaves son las mismas en los dos servidores, así que solo cambia la URL.
#
# Decisión de Alvaro (19/11/2026): pasar a Miami a las 6:00 a. m. de Colombia, y
# si en la primera hora sale peor que St. Louis (más conexiones malas o más
# ping), volver solo a St. Louis.
# El traslado del 20/11/2026 ya terminó. Se conserva la herramienta manual:
# destino = miami | stlouis | revisar. Los cron con día/mes se repetían cada año
# y podían volver a mover producción el 20/11 sin una decisión nueva.

on:
  workflow_dispatch:
    inputs:
      destino:
        description: 'miami | stlouis | revisar'
        type: choice
        options: [miami, stlouis, revisar]
        required: true

concurrency:
  group: livekit-region
  cancel-in-progress: false

jobs:
  mover:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lsagslbkliprespbyhts
      URL_MIAMI: wss://45-32-172-118.sslip.io
      URL_STLOUIS: wss://lk.asmtech.ai
    steps:
      - name: Qué toca
        id: que
        run: |
          echo "accion=${{ inputs.destino }}" >> "$GITHUB_OUTPUT"

      - name: Guard — token
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "::error::Falta SUPABASE_ACCESS_TOKEN"; exit 1; fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: URL vigente (no es secreta)
        run: |
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            | jq -r '.[] | select(.name=="LIVEKIT_URL") | "LIVEKIT_URL vigente: " + (.value // "(la API no devuelve el valor)")' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Revisar Miami (solo si las llamadas ya están en Miami)
        id: revisar
        if: steps.que.outputs.accion == 'revisar'
        run: |
          set -euo pipefail
          # ¿Estamos en Miami? La API da el sha256 del valor del secreto.
          VIG=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" | jq -r '.[] | select(.name=="LIVEKIT_URL") | .value')
          MIA=$(printf '%s' "$URL_MIAMI" | sha256sum | cut -d' ' -f1)
          if [ "$VIG" != "$MIA" ] && [ "$VIG" != "$URL_MIAMI" ]; then
            echo "Las llamadas no están en Miami: no hay nada que revisar." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "peor=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Dos pruebas, con la gente que ya está en Miami (últimos 50 min):
          #  1) Ping medido desde el mismo computador a cada servidor (datos.regiones):
          #     si Miami tarda más que St. Louis, es peor.
          #  2) Conexión mala (poor/lost): si pasa de 12 % (el día normal en
          #     St. Louis anda entre 3 y 11 %), es peor.
          SQL=$(cat <<'Q'
          select json_build_object(
            'n', count(*),
            'mala', round(100.0 * avg((datos->>'calidad' in ('poor','lost'))::int), 2),
            'n_reg', count(*) filter (where datos ? 'regiones'),
            'mia', percentile_cont(0.5) within group (order by nullif((datos->'regiones'->>'mia')::numeric, 0)),
            'stl', percentile_cont(0.5) within group (order by nullif((datos->'regiones'->>'stl')::numeric, 0)))
            from llamada_salud where creado > now() - interval '50 minutes'
          Q
          )
          R=$(curl -sf -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
               "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
               -d "$(jq -n --arg q "$SQL" '{query:$q}')")
          J=$(echo "$R" | jq -c '.[0].json_build_object')
          N=$(echo "$J" | jq '.n'); MALA=$(echo "$J" | jq '.mala // 0'); NR=$(echo "$J" | jq '.n_reg')
          MIAP=$(echo "$J" | jq '.mia // 0'); STLP=$(echo "$J" | jq '.stl // 0')
          PEOR=$(jq -n --argjson n "$N" --argjson m "$MALA" --argjson nr "$NR" --argjson a "$MIAP" --argjson b "$STLP" \
            'if $n < 200 then false else ($m > 12) or ($nr >= 20 and $a > 0 and $b > 0 and $a > $b) end')
          echo "Miami: $N muestras, conexión mala $MALA % · ping medido: Miami $MIAP ms vs St. Louis $STLP ms ($NR mediciones) → peor=$PEOR" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "peor=$PEOR" >> "$GITHUB_OUTPUT"

      - name: Cambiar LIVEKIT_URL
        if: steps.que.outputs.accion == 'miami' || steps.que.outputs.accion == 'stlouis' || steps.revisar.outputs.peor == 'true'
        run: |
          set -euo pipefail
          A="${{ steps.que.outputs.accion }}"
          if [ "$A" = "miami" ]; then URL="$URL_MIAMI"; else URL="$URL_STLOUIS"; fi
          supabase secrets set "LIVEKIT_URL=$URL" --project-ref "$PROJECT_REF"
          echo "LIVEKIT_URL → $URL" | tee -a "$GITHUB_STEP_SUMMARY"
