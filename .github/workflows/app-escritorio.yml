# Arma la app de computador (desktop/) y sube los instaladores al balde público
# `descargas` de Supabase, de donde los baja el botón de la portada:
#   …/storage/v1/object/public/descargas/Maven-Mac.dmg
#   …/storage/v1/object/public/descargas/Maven-Windows.exe
# Windows se arma en una máquina Windows de GitHub; Mac, ver app-escritorio-mac.yml.
# La llave de servicio se pide al vuelo con SUPABASE_ACCESS_TOKEN y no se guarda.
name: app-escritorio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/app-escritorio.yml"]

concurrency:
  group: app-escritorio
  cancel-in-progress: true

jobs:
  # Mac: ya NO se arma aquí. El Mac mini del CI corre sin sesión de usuario y
  # no puede firmar con el Developer ID (errSecInternalComponent, 17/11/2026):
  # la app salía sin firma o con firma ad hoc. Ahora se arma, firma y notariza
  # en el MacBook de Alvaro con `desktop/publicar-mac.sh`, que la sube a un
  # release `mac-v*` de GitHub; el workflow app-escritorio-mac la copia al balde.

  # Windows: en una máquina Windows de GitHub (el makensis del Mac mini es de
  # Intel sin Rosetta, y en Linux pide wine).
  windows:
    runs-on: windows-latest
    # Firma de Windows (17/11/2026): Azure Artifact Signing, cuenta «mavenfirma»,
    # certificado «mavenwindows» a nombre de Alvaro Mejia. GitHub entra a Azure
    # sin contraseña (OIDC): la app «maven-firma-github» confía solo en la rama
    # main de este repo y solo puede firmar. Los IDs van en variables del repo.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    env:
      PROYECTO: lsagslbkliprespbyhts
      ARCHIVOS: Maven-Windows.exe Maven-Windows.exe.blockmap latest.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Entrar a Azure para firmar (sin contraseña)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Armar
        working-directory: desktop
        run: |
          npm version "2.0.${{ github.run_number }}" --no-git-tag-version
          npx electron-builder --win --publish never -c.directories.output=dist
      - name: Revisar que salió firmado (si no, no se publica)
        shell: pwsh
        run: |
          foreach ($archivo in @("desktop/dist/Maven-Windows.exe", "desktop/dist/win-unpacked/Maven.exe")) {
            $firma = Get-AuthenticodeSignature $archivo
            Write-Host "$archivo -> $($firma.Status) · $($firma.SignerCertificate.Subject)"
            if ($firma.Status -ne "Valid" -or $firma.SignerCertificate.Subject -notmatch "CN=Alvaro Mejia") {
              throw "$archivo salió sin la firma de Alvaro Mejia: no se publica."
            }
          }
      - name: Subir a Supabase (balde descargas)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          LLAVE=$(curl -fsS "https://api.supabase.com/v1/projects/$PROYECTO/api-keys?reveal=true" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).find(k=>k.name==="service_role").api_key))')
          echo "::add-mask::$LLAVE"
          # El .yml va al final: anuncia la versión nueva solo cuando ya subió todo.
          for ARCHIVO in $ARCHIVOS; do
            curl -fsS -X POST "https://$PROYECTO.supabase.co/storage/v1/object/descargas/$ARCHIVO" \
              -H "Authorization: Bearer $LLAVE" -H "apikey: $LLAVE" \
              -H "x-upsert: true" -H "cache-control: max-age=60" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@desktop/dist/$ARCHIVO" >/dev/null
            echo "subido $ARCHIVO"
          done
