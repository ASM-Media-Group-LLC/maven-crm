name: Edificio · secretos (maven-agencias)

# TREN DE AGENCIAS · VAGÓN 1 «EDIFICIO VIVO» (19/11/2026).
# Llena los secretos de las funciones del EDIFICIO (maven-agencias,
# ezeigddgkaemxpshghmu) y su bóveda (vault) para los relojes. Ver
# docs/edificio-secretos.md: qué es cada uno y de dónde sale.
#
#   · Los INTERNOS del edificio (token de los relojes, firma de links de Meet…) se
#     generan aquí, nuevos, y nunca se parecen a los de Kash. Si ya existen y la
#     bóveda los tiene, no se tocan (salvo «rotar_internos»).
#   · Los COMPARTIDOS con Kash (LiveKit, ONLYOFFICE…) salen de los secrets de GitHub
#     que ya existen; el resto, de secrets de GitHub con prefijo EDIFICIO_ que Alvaro
#     agrega (p. ej. EDIFICIO_RESEND_API_KEY). Si uno no está, se salta y se avisa.
#   · Ningún valor se imprime.
#
# CANDADO: la base está escrita aquí y se aborta si fuera Kash (lsagslbkliprespbyhts).

on:
  workflow_dispatch:
    inputs:
      rotar_internos:
        description: 'Generar de nuevo los secretos internos del edificio (token de relojes, Meet…)'
        type: boolean
        default: false

concurrency:
  group: edificio-secretos
  cancel-in-progress: false

env:
  EDIFICIO_REF: ezeigddgkaemxpshghmu
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Candado — solo el edificio, nunca Kash
        run: |
          set -euo pipefail
          source infra/casas/guarda-kash.sh
          solo_edificio "$EDIFICIO_REF"
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Armar los secretos (sin imprimir valores)
        env:
          ROTAR: ${{ github.event.inputs.rotar_internos }}
          # Compartidos con Kash que ya están en GitHub
          GH_LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY_NUEVA }}
          GH_LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET_NUEVA }}
          GH_ONLYOFFICE_JWT_SECRET: ${{ secrets.ONLYOFFICE_JWT_SECRET_NUEVO }}
          # Los que Alvaro agrega en GitHub con prefijo EDIFICIO_ (ver docs/edificio-secretos.md)
          E_LIVEKIT_URL: ${{ secrets.EDIFICIO_LIVEKIT_URL }}
          E_RESEND_API_KEY: ${{ secrets.EDIFICIO_RESEND_API_KEY }}
          E_GEMINI_API_KEY: ${{ secrets.EDIFICIO_GEMINI_API_KEY }}
          E_ELEVENLABS_API_KEY: ${{ secrets.EDIFICIO_ELEVENLABS_API_KEY }}
          E_VAPID_PUBLIC_KEY: ${{ secrets.EDIFICIO_VAPID_PUBLIC_KEY }}
          E_VAPID_PRIVATE_KEY: ${{ secrets.EDIFICIO_VAPID_PRIVATE_KEY }}
          E_VAPID_SUBJECT: ${{ secrets.EDIFICIO_VAPID_SUBJECT }}
          E_MAVEN_JWT_SECRET: ${{ secrets.EDIFICIO_MAVEN_JWT_SECRET }}
          E_ONLYOFFICE_URL: ${{ secrets.EDIFICIO_ONLYOFFICE_URL }}
          E_GOTENBERG_URL: ${{ secrets.EDIFICIO_GOTENBERG_URL }}
          E_GOTENBERG_USER: ${{ secrets.EDIFICIO_GOTENBERG_USER }}
          E_GOTENBERG_PASS: ${{ secrets.EDIFICIO_GOTENBERG_PASS }}
          E_R2_ACCOUNT_ID: ${{ secrets.EDIFICIO_R2_ACCOUNT_ID }}
          E_R2_ACCESS_KEY_ID: ${{ secrets.EDIFICIO_R2_ACCESS_KEY_ID }}
          E_R2_SECRET_ACCESS_KEY: ${{ secrets.EDIFICIO_R2_SECRET_ACCESS_KEY }}
          E_R2_BUCKET_OFICINA: ${{ secrets.EDIFICIO_R2_BUCKET_OFICINA }}
          E_R2_BUCKET_CONVERTIDOS: ${{ secrets.EDIFICIO_R2_BUCKET_CONVERTIDOS }}
          E_R2_BUCKET_GRABACIONES: ${{ secrets.EDIFICIO_R2_BUCKET_GRABACIONES }}
          E_RECORDINGS_BASE_URL: ${{ secrets.EDIFICIO_RECORDINGS_BASE_URL }}
          E_RECORDINGS_SIGNING_SECRET: ${{ secrets.EDIFICIO_RECORDINGS_SIGNING_SECRET }}
          E_DRIVE_NAS_URL: ${{ secrets.EDIFICIO_DRIVE_NAS_URL }}
          E_DRIVE_SECRETO: ${{ secrets.EDIFICIO_DRIVE_SECRETO }}
          E_GOOGLE_AI_API_KEY: ${{ secrets.EDIFICIO_GOOGLE_AI_API_KEY }}
          E_OPENROUTER_API_KEY: ${{ secrets.EDIFICIO_OPENROUTER_API_KEY }}
          E_ANTHROPIC_API_KEY: ${{ secrets.EDIFICIO_ANTHROPIC_API_KEY }}
          E_GROQ_API_KEY: ${{ secrets.EDIFICIO_GROQ_API_KEY }}
        run: |
          set -euo pipefail
          source infra/casas/guarda-kash.sh
          solo_edificio "$EDIFICIO_REF"
          API="https://api.supabase.com/v1/projects/$EDIFICIO_REF"
          H=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          ENV_FILE="$RUNNER_TEMP/edificio.env"; : > "$ENV_FILE"; chmod 600 "$ENV_FILE"
          puestos=(); faltan=()
          poner() { # nombre valor
            if [ -n "${2:-}" ]; then printf '%s=%s\n' "$1" "$2" >> "$ENV_FILE"; puestos+=("$1"); else faltan+=("$1"); fi
          }

          # 1) Lo que ya tiene el edificio (solo nombres).
          EXISTEN="$(curl -sS -f "$API/secrets" "${H[@]}" | jq -r '.[].name')"
          BOVEDA="$(curl -sS -f -X POST "$API/database/query" "${H[@]}" \
            -d '{"query":"select coalesce(json_agg(name), '"'"'[]'"'"'::json) as n from vault.secrets","read_only":true}' | jq -r '.[0].n[]')"

          # 2) Internos del edificio: nuevos, nunca los de Kash.
          gen() { openssl rand -hex 32; }
          if [ "${ROTAR:-false}" = "true" ] || ! grep -qx CRON_INTERNAL_TOKEN <<< "$EXISTEN" || ! grep -qx cron_internal_token <<< "$BOVEDA"; then
            CRON_TOKEN="$(gen)"; REC_TOKEN="$(gen)"
            poner CRON_INTERNAL_TOKEN "$CRON_TOKEN"
            poner INTERNAL_CRON_TOKEN "$CRON_TOKEN"
            poner CRON_SECRET "$CRON_TOKEN"
            poner RECORDINGS_CRON_TOKEN "$REC_TOKEN"
            NUEVOS_INTERNOS=1
          else
            NUEVOS_INTERNOS=0
          fi
          for n in MEET_LINK_SECRET MEET_GUEST_IP_SALT; do
            if [ "${ROTAR:-false}" = "true" ] || ! grep -qx "$n" <<< "$EXISTEN"; then poner "$n" "$(gen)"; fi
          done

          # 3) Configuración fija (no son secretos de verdad).
          poner APP_URL "https://app.maven-ai.me"
          poner NOTIFICATION_FROM_EMAIL "noreply@envios.maven-ai.me"

          # 4) Compartidos con Kash.
          poner LIVEKIT_API_KEY "${GH_LIVEKIT_API_KEY:-}"
          poner LIVEKIT_API_SECRET "${GH_LIVEKIT_API_SECRET:-}"
          poner ONLYOFFICE_JWT_SECRET "${GH_ONLYOFFICE_JWT_SECRET:-}"
          for n in LIVEKIT_URL RESEND_API_KEY GEMINI_API_KEY ELEVENLABS_API_KEY VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT \
                   MAVEN_JWT_SECRET ONLYOFFICE_URL GOTENBERG_URL GOTENBERG_USER GOTENBERG_PASS \
                   R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_OFICINA R2_BUCKET_CONVERTIDOS R2_BUCKET_GRABACIONES \
                   RECORDINGS_BASE_URL RECORDINGS_SIGNING_SECRET DRIVE_NAS_URL DRIVE_SECRETO \
                   GOOGLE_AI_API_KEY OPENROUTER_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY; do
            v="E_$n"
            if [ -n "${!v:-}" ]; then poner "$n" "${!v}"
            elif ! grep -qx "$n" <<< "$EXISTEN"; then faltan+=("$n"); fi
          done

          # 5) Subir los secretos de las funciones.
          if [ -s "$ENV_FILE" ]; then supabase secrets set --project-ref "$EDIFICIO_REF" --env-file "$ENV_FILE" >/dev/null; fi

          # 6) La bóveda que leen los relojes y los disparadores del edificio.
          ANON="$(curl -sS -f "$API/api-keys" "${H[@]}" | jq -r '.[] | select(.name == "anon") | .api_key' | head -1)"
          boveda() { # nombre valor
            local q
            # Nombre y valor van entre $n$…$n$ y $v$…$v$ (comillas de Postgres): sin escapes.
            q="$(jq -n --arg n "$1" --arg v "$2" '{query: ("do $b$ begin if exists (select 1 from vault.secrets where name = $n$" + $n + "$n$) then perform vault.update_secret((select id from vault.secrets where name = $n$" + $n + "$n$), $v$" + $v + "$v$); else perform vault.create_secret($v$" + $v + "$v$, $n$" + $n + "$n$); end if; end $b$;")}')"
            curl -sS -f -X POST "$API/database/query" "${H[@]}" -d "$q" >/dev/null
          }
          boveda project_url "https://$EDIFICIO_REF.supabase.co"
          [ -n "$ANON" ] && boveda supabase_anon_key "$ANON"
          if [ "$NUEVOS_INTERNOS" = "1" ]; then
            boveda cron_internal_token "$CRON_TOKEN"
            boveda recordings_cron_token "$REC_TOKEN"
          fi
          [ -n "${E_GOTENBERG_URL:-}" ] && boveda gotenberg_url "$E_GOTENBERG_URL"
          [ -n "${E_GOTENBERG_USER:-}" ] && boveda gotenberg_user "$E_GOTENBERG_USER"
          [ -n "${E_GOTENBERG_PASS:-}" ] && boveda gotenberg_pass "$E_GOTENBERG_PASS"
          rm -f "$ENV_FILE"

          {
            echo "## Secretos del edificio"
            echo "Puestos ahora: ${puestos[*]:-ninguno}"
            echo ""
            echo "Faltan (agrega el secret EDIFICIO_<NOMBRE> en GitHub y vuelve a correr): ${faltan[*]:-ninguno}"
            echo ""
            echo "Internos nuevos: $([ "$NUEVOS_INTERNOS" = 1 ] && echo sí || echo 'no (ya estaban)')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Nombres que quedaron (sin valores)
        run: |
          set -euo pipefail
          curl -sS "https://api.supabase.com/v1/projects/$EDIFICIO_REF/secrets" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[].name' | sort | tr '\n' ' ' | tee -a "$GITHUB_STEP_SUMMARY"
