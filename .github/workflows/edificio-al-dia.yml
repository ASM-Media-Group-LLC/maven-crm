name: Edificio · base al día (maven-agencias)

# TREN DE AGENCIAS · VAGÓN 1 «EDIFICIO VIVO» (19/11/2026).
# Pone al día la base del EDIFICIO (maven-agencias, ezeigddgkaemxpshghmu) con todo
# lo que Kash recibió después de sacar el molde (16/11 02:16 UTC), saneado por
# infra/casas/al-dia.sh, más los relojes propios del edificio.
#
# CANDADO: la base está escrita aquí (EDIFICIO_REF) y se comprueba tres veces que
# no sea Kash (lsagslbkliprespbyhts): guarda-kash.sh, al-dia.sh y antes de enlazar.
# Este workflow NO lee ni escribe nada de Kash.
#
# Siempre hace primero el ENSAYO: levanta un Postgres vacío en el runner, le mete el
# molde y después cada migración nueva, una por una, y dice cuál entra y cuál falla.
# Solo si el ensayo sale limpio y se dispara a mano con «aplicar», la sube al edificio.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Después del ensayo limpio, aplicar al edificio (si no, solo ensayo)'
        type: boolean
        default: false
  # Mientras el vagón no llega a main: ensayo (nunca aplica) al empujar la rama.
  push:
    branches: ['claude/edificio-vivo']
    paths:
      - 'infra/casas/**'
      - '.github/workflows/edificio-al-dia.yml'

concurrency:
  group: edificio-al-dia
  cancel-in-progress: false

env:
  EDIFICIO_REF: ezeigddgkaemxpshghmu
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  ensayo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      limpio: ${{ steps.ensayo.outputs.limpio }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Candado — solo el edificio, nunca Kash
        run: |
          set -euo pipefail
          source infra/casas/guarda-kash.sh
          solo_edificio "$EDIFICIO_REF"
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN"; exit 1; }

      - name: Qué versiones ya tiene el edificio (solo lectura)
        run: |
          set -euo pipefail
          Q="select coalesce(json_agg(version order by version), '[]'::json) as v from supabase_migrations.schema_migrations"
          curl -sS -f -X POST "https://api.supabase.com/v1/projects/$EDIFICIO_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$Q" '{query: $q, read_only: true}')" \
            | jq -r '.[0].v[]' > "$RUNNER_TEMP/ya-aplicadas.txt"
          echo "Versiones en el edificio: $(wc -l < "$RUNNER_TEMP/ya-aplicadas.txt")"
          tail -5 "$RUNNER_TEMP/ya-aplicadas.txt"

      - name: Preparar molde y migraciones saneadas
        run: |
          set -euo pipefail
          infra/casas/preparar.sh agencias "$RUNNER_TEMP/molde"
          infra/casas/al-dia.sh agencias "$RUNNER_TEMP/al-dia/migraciones" "$RUNNER_TEMP/ya-aplicadas.txt"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Levantar un Postgres vacío (local del runner)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local" && cd "$RUNNER_TEMP/local"
          supabase init --force >/dev/null
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          supabase db start

      - name: Ensayo — molde + migraciones nuevas, una por una
        id: ensayo
        run: |
          set -uo pipefail
          URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          R="$RUNNER_TEMP/al-dia/ensayo.md"
          psql "$URL" -q -c "create extension if not exists pg_cron; create extension if not exists pg_net;" >/dev/null 2>&1 || true
          for f in "$RUNNER_TEMP"/molde/*.sql; do
            psql "$URL" -v ON_ERROR_STOP=0 -q -f "$f" > /dev/null 2>> "$RUNNER_TEMP/al-dia/errores-molde.txt" || true
          done
          echo "## Ensayo del edificio al día" > "$R"
          echo "" >> "$R"
          echo "Errores al levantar el molde en limpio (base de referencia): $(grep -c 'ERROR' "$RUNNER_TEMP/al-dia/errores-molde.txt" || true)" >> "$R"
          echo "" >> "$R"
          echo "| Migración | Resultado |" >> "$R"
          echo "|---|---|" >> "$R"
          malas=0
          for f in "$RUNNER_TEMP"/al-dia/migraciones/*.sql; do
            b="$(basename "$f")"
            case "$b" in *_ya_aplicada.sql) continue;; esac
            if salida="$(psql "$URL" -v ON_ERROR_STOP=1 -1 -q -f "$f" 2>&1 >/dev/null)"; then
              echo "| $b | entra |" >> "$R"
            else
              malas=$((malas + 1))
              err="$(echo "$salida" | grep -m1 ERROR | tr '|' '/' | cut -c1-220)"
              echo "| $b | **falla**: $err |" >> "$R"
            fi
          done
          echo "" >> "$R"
          psql "$URL" -At >> "$R" <<'SQL'
          select 'Tablas en public: ' || count(*) from pg_tables where schemaname = 'public';
          select 'Funciones en public: ' || count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public';
          select 'Relojes (cron): ' || count(*) || ' (' || count(*) filter (where active) || ' prendidos)' from cron.job;
          SQL
          cat "$R" >> "$GITHUB_STEP_SUMMARY"
          cat "$R"
          if [ "$malas" -eq 0 ]; then echo "limpio=true" >> "$GITHUB_OUTPUT"; else echo "limpio=false" >> "$GITHUB_OUTPUT"; fi
          echo "Migraciones que fallan en el ensayo: $malas"

      - name: Guardar el reporte y las migraciones saneadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edificio-al-dia
          path: |
            ${{ runner.temp }}/al-dia/
          retention-days: 14

  aplicar:
    needs: ensayo
    if: github.event_name == 'workflow_dispatch' && inputs.aplicar && needs.ensayo.outputs.limpio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Candado — solo el edificio, nunca Kash
        run: |
          set -euo pipefail
          source infra/casas/guarda-kash.sh
          solo_edificio "$EDIFICIO_REF"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar al edificio (nunca a Kash)
        run: |
          set -euo pipefail
          source infra/casas/guarda-kash.sh
          solo_edificio "$EDIFICIO_REF"
          Q="select coalesce(json_agg(version order by version), '[]'::json) as v from supabase_migrations.schema_migrations"
          curl -sS -f -X POST "https://api.supabase.com/v1/projects/$EDIFICIO_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$Q" '{query: $q, read_only: true}')" \
            | jq -r '.[0].v[]' > "$RUNNER_TEMP/ya-aplicadas.txt"
          mkdir -p "$RUNNER_TEMP/edificio" && cd "$RUNNER_TEMP/edificio"
          supabase init --force >/dev/null
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          "$GITHUB_WORKSPACE/infra/casas/al-dia.sh" agencias supabase/migrations "$RUNNER_TEMP/ya-aplicadas.txt"
          ! grep -rq "lsagslbkliprespbyhts" supabase/ || { echo "::error::ALTO: algo apunta a Kash"; exit 1; }
          supabase link --project-ref "$EDIFICIO_REF" </dev/null
          supabase db push --linked --include-all --yes

      - name: Contar lo que quedó en el edificio
        run: |
          set -euo pipefail
          Q="select json_build_object(
            'tablas', (select count(*) from pg_tables where schemaname = 'public'),
            'funciones', (select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public'),
            'relojes', (select count(*) from cron.job),
            'relojes_prendidos', (select count(*) from cron.job where active),
            'ultima_version', (select max(version) from supabase_migrations.schema_migrations)
          ) as conteo"
          curl -sS -X POST "https://api.supabase.com/v1/projects/$EDIFICIO_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$Q" '{query: $q, read_only: true}')" | tee -a "$GITHUB_STEP_SUMMARY"
