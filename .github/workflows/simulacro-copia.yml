# SIMULACRO (Alvaro, 19/11/2026): copia SOLO LA ESTRUCTURA de producción
# (tablas, reglas, funciones; NADA de datos) al proyecto aparte
# «maven-simulacro» (glzncicyfrjidvkjjaig), donde corren las 1000 personas
# inventadas sin tocar producción. Se dispara al subir a la rama
# simulacro-copia. Usa el mismo SUPABASE_ACCESS_TOKEN de deploy-edge-functions.
name: simulacro-copia
on:
  push:
    branches: [simulacro-copia]
  workflow_dispatch:
concurrency: { group: simulacro-copia, cancel-in-progress: false }
jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD: lsagslbkliprespbyhts
      COPIA: glzncicyfrjidvkjjaig
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Estructura de producción (sin datos)
        run: |
          set -euo pipefail
          test "$COPIA" != "$PROD"
          mkdir -p /tmp/sim && cd /tmp/sim && supabase init --force >/dev/null 2>&1 || true
          supabase link --project-ref "$PROD" < /dev/null
          supabase db dump --linked -f esquema.sql
          echo "tamaño: $(wc -c < esquema.sql) bytes, $(grep -c '^CREATE TABLE' esquema.sql) tablas"
      - name: Quitar lo que habla hacia afuera (webhooks de la base)
        run: |
          cd /tmp/sim
          python3 - <<'PY'
          import re
          s=open('esquema.sql').read()
          # separa por ';' fuera de comillas y de bloques $tag$
          out=[];cur=[];i=0;n=len(s);q=None;dq=None
          while i<n:
              c=s[i]
              if dq:
                  if s.startswith(dq,i): cur.append(dq); i+=len(dq); dq=None; continue
              elif q:
                  if c=="'" : q=None
              elif s.startswith('--',i):
                  j=s.find('\n',i); j=n if j<0 else j; i=j; continue
              elif c=="'": q=c
              elif c=='$':
                  m=re.match(r'\$[A-Za-z_]*\$',s[i:])
                  if m: dq=m.group(0); cur.append(dq); i+=len(dq); continue
              if c==';' and not q and not dq:
                  t=''.join(cur).strip()
                  if t: out.append(t)
                  cur=[]
              else: cur.append(c)
              i+=1
          limpio=[t for t in out if 'supabase_functions' not in t]
          print('instrucciones:', len(out), 'quitadas (webhooks):', len(out)-len(limpio))
          open('esquema_limpio.sql','w').write(';\n\n'.join(limpio)+';\n')
          PY
      - name: Cargarla en la copia
        run: |
          set -euo pipefail
          cd /tmp/sim
          supabase link --project-ref "$COPIA" < /dev/null
          mkdir -p supabase/migrations
          rm -f supabase/migrations/*.sql
          cp esquema_limpio.sql supabase/migrations/20260101000000_esquema_produccion.sql
          supabase db push --linked --include-all --yes 2>&1 | tail -25
  configuracion:
    # Copia SOLO la configuración (puestos, permisos, posiciones, banderas):
    # nada de personas, mensajes ni archivos. Por la API de administración.
    needs: copiar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD: lsagslbkliprespbyhts
      COPIA: glzncicyfrjidvkjjaig
    steps:
      - name: Copiar configuración
        run: |
          set -euo pipefail
          test "$COPIA" != "$PROD"
          q() { curl -sS -X POST "https://api.supabase.com/v1/projects/$1/database/query" \
                 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @"$2"; }
          for t in tenants roles_config role_groups role_permissions app_flags monitor_config posiciones_catalogo posiciones_borrador; do
            jq -n --arg s "select coalesce(json_agg(x), '[]'::json) as d from public.$t x" '{query:$s}' > leer.json
            q "$PROD" leer.json | jq -c '.[0].d' > datos.json
            echo "$t: $(jq length datos.json) filas"
            jq -n --arg t "$t" --rawfile d datos.json \
              '{query: ("alter table public." + $t + " disable trigger user; insert into public." + $t + " select * from json_populate_recordset(null::public." + $t + ", $sim$" + $d + "$sim$::json) on conflict do nothing; alter table public." + $t + " enable trigger user;")}' > escribir.json
            q "$COPIA" escribir.json | head -c 300; echo
          done
  funciones:
    # Las funciones del servidor (las mismas de producción) publicadas en la
    # COPIA, apuntando a la RÉPLICA del servidor de llamadas (144.126.155.175).
    # Las llaves son de la réplica de pruebas, nunca las de producción.
    needs: copiar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      COPIA: glzncicyfrjidvkjjaig
      LK_KEY: ${{ secrets.SIM_LIVEKIT_API_KEY }}
      LK_SECRET: ${{ secrets.SIM_LIVEKIT_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: supabase/setup-cli@v1
        with: { version: 2.110.0 }
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - name: Llaves de la réplica (si ya están)
        run: |
          set -euo pipefail
          if [ -z "${LK_KEY:-}" ] || [ -z "${LK_SECRET:-}" ]; then echo "::warning::Faltan SIM_LIVEKIT_API_KEY/SECRET: las funciones se publican sin llamadas"; exit 0; fi
          supabase secrets set --project-ref "$COPIA" LIVEKIT_URL="ws://144.126.155.175:7880" LIVEKIT_API_KEY="$LK_KEY" LIVEKIT_API_SECRET="$LK_SECRET" >/dev/null
          echo "llaves puestas en la copia"
      - name: Publicar funciones en la copia
        run: |
          set -uo pipefail
          ok=0; mal=0
          for d in supabase/functions/*/; do
            n=$(basename "$d"); case "$n" in _*) continue;; esac
            [ -f "$d/index.ts" ] || continue
            if supabase functions deploy "$n" --project-ref "$COPIA" --use-api >/dev/null 2>&1; then ok=$((ok+1)); else mal=$((mal+1)); echo "no se pudo: $n"; fi
          done
          echo "publicadas: $ok · fallaron: $mal"
