# SIMULACRO (Alvaro, 19/11/2026): copia SOLO LA ESTRUCTURA de producción
# (tablas, reglas, funciones; NADA de datos) al proyecto aparte
# «maven-simulacro» (glzncicyfrjidvkjjaig), donde corren las 1000 personas
# inventadas sin tocar producción. Se dispara al subir a la rama
# simulacro-copia. Usa el mismo SUPABASE_ACCESS_TOKEN de deploy-edge-functions.
name: simulacro-copia
on:
  push:
    branches: [simulacro-copia]
  workflow_dispatch:
concurrency: { group: simulacro-copia, cancel-in-progress: false }
jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD: lsagslbkliprespbyhts
      COPIA: glzncicyfrjidvkjjaig
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Estructura de producción (sin datos)
        run: |
          set -euo pipefail
          test "$COPIA" != "$PROD"
          mkdir -p /tmp/sim && cd /tmp/sim && supabase init --force >/dev/null 2>&1 || true
          supabase link --project-ref "$PROD" < /dev/null
          supabase db dump --linked -f esquema.sql
          echo "tamaño: $(wc -c < esquema.sql) bytes, $(grep -c '^CREATE TABLE' esquema.sql) tablas"
      - name: Quitar lo que habla hacia afuera (webhooks de la base)
        run: |
          cd /tmp/sim
          python3 - <<'PY'
          import re
          s=open('esquema.sql').read()
          # separa por ';' fuera de comillas y de bloques $tag$
          out=[];cur=[];i=0;n=len(s);q=None;dq=None
          while i<n:
              c=s[i]
              if dq:
                  if s.startswith(dq,i): cur.append(dq); i+=len(dq); dq=None; continue
              elif q:
                  if c=="'" : q=None
              elif s.startswith('--',i):
                  j=s.find('\n',i); j=n if j<0 else j; i=j; continue
              elif c=="'": q=c
              elif c=='$':
                  m=re.match(r'\$[A-Za-z_]*\$',s[i:])
                  if m: dq=m.group(0); cur.append(dq); i+=len(dq); continue
              if c==';' and not q and not dq:
                  t=''.join(cur).strip()
                  if t: out.append(t)
                  cur=[]
              else: cur.append(c)
              i+=1
          limpio=[t for t in out if 'supabase_functions' not in t]
          print('instrucciones:', len(out), 'quitadas (webhooks):', len(out)-len(limpio))
          open('esquema_limpio.sql','w').write(';\n\n'.join(limpio)+';\n')
          PY
      - name: Cargarla en la copia
        run: |
          set -euo pipefail
          cd /tmp/sim
          supabase link --project-ref "$COPIA" < /dev/null
          mkdir -p supabase/migrations
          rm -f supabase/migrations/*.sql
          cp esquema_limpio.sql supabase/migrations/20260101000000_esquema_produccion.sql
          supabase db push --linked --include-all --yes --debug 2>&1 | grep -iE -B2 -A8 "error|failed" | head -80; exit ${PIPESTATUS[0]}
