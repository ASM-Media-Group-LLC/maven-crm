# Publica la app de Mac: copia los archivos de un release `mac-v*` (armado,
# firmado con el Developer ID y notarizado por Apple en el MacBook de Alvaro con
# desktop/publicar-mac.sh) al balde público `descargas` de Supabase.
# La firma (Developer ID de Alvaro + notarización) se revisa en el Mac antes de
# crear el release (publicar-mac.sh: codesign, spctl y stapler). Aquí corre en
# Linux (18/11/2026: tres veces seguidas GitHub no tuvo Macs libres y la versión
# nunca llegó a la descarga) y revisa que los archivos coincidan con el
# latest-mac.yml y con la versión del release.
name: app-escritorio-mac

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release a publicar (mac-v…)"
        required: true

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'mac-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROYECTO: lsagslbkliprespbyhts
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ARCHIVOS: Maven-Mac.dmg Maven-Mac.zip Maven-Mac.zip.blockmap latest-mac.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bajar el release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mac" && cd "$RUNNER_TEMP/mac"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -la
      - name: Revisar que los archivos coincidan
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mac"
          VERSION="${TAG#mac-v}"
          grep -q "^version: $VERSION$" latest-mac.yml || { echo "latest-mac.yml no es de $VERSION"; exit 1; }
          ESPERADO=$(awk '/- url: Maven-Mac.zip/{f=1} f && /sha512:/{print $2; exit}' latest-mac.yml)
          REAL=$(openssl dgst -sha512 -binary Maven-Mac.zip | base64 -w0)
          [ "$ESPERADO" = "$REAL" ] || { echo "el zip no coincide con latest-mac.yml"; exit 1; }
          unzip -l Maven-Mac.zip | grep -q "Maven.app/Contents/_CodeSignature/CodeResources" || { echo "el zip no trae la app firmada"; exit 1; }
          echo "ok: $VERSION"
      - name: Subir a Supabase (balde descargas)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          LLAVE=$(curl -fsS "https://api.supabase.com/v1/projects/$PROYECTO/api-keys?reveal=true" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | python3 -c 'import json,sys; print(next(k["api_key"] for k in json.load(sys.stdin) if k["name"]=="service_role"))')
          echo "::add-mask::$LLAVE"
          # El .yml va al final: anuncia la versión nueva solo cuando ya subió todo.
          for ARCHIVO in $ARCHIVOS; do
            curl -fsS -X POST "https://$PROYECTO.supabase.co/storage/v1/object/descargas/$ARCHIVO" \
              -H "Authorization: Bearer $LLAVE" -H "apikey: $LLAVE" \
              -H "x-upsert: true" -H "cache-control: max-age=60" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$RUNNER_TEMP/mac/$ARCHIVO" >/dev/null
            echo "subido $ARCHIVO"
          done
