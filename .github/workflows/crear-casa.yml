name: Crear casa (aplicar el molde a la base de una agencia nueva)

# TREN DE AGENCIAS · VAGÓN 1 (15/11/2026). Le mete el molde (la estructura de
# Maven sin datos) a la base NUEVA de una agencia, listada en
# infra/casas/casas.json. Antes, preparar.sh cambia lo propio de Kash (su
# dirección y su código de agencia) por los de la casa.
#
# CANDADO: se niega a correr contra la base de Kash (lsagslbkliprespbyhts), dos
# veces: en preparar.sh y aquí mismo, antes de enlazar.
#
# Mientras el tren no llega a main corre al empujar la rama con
# infra/casas/aplicar.json ({"casa": "<id>"}); en main, a mano con el id.

on:
  workflow_dispatch:
    inputs:
      casa:
        description: 'Id de la casa en infra/casas/casas.json'
        required: true
  push:
    branches: ['tren-vagon-1-molde']
    paths: ['infra/casas/aplicar.json', 'infra/casas/molde/**', 'infra/casas/preparar.sh']

concurrency:
  group: crear-casa
  cancel-in-progress: false

jobs:
  casa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ¿Qué casa?
        id: cual
        run: |
          set -euo pipefail
          CASA="${{ github.event.inputs.casa }}"
          if [ -z "$CASA" ]; then CASA="$(jq -r .casa infra/casas/aplicar.json)"; fi
          REF="$(jq -r --arg id "$CASA" '.casas[] | select(.id == $id) | .ref' infra/casas/casas.json)"
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then echo "::error::La casa «$CASA» no está en casas.json"; exit 1; fi
          if [ "$REF" = "lsagslbkliprespbyhts" ]; then echo "::error::ALTO: esa es la base de Kash. Kash no se toca."; exit 1; fi
          echo "casa=$CASA" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Casa: $CASA → $REF"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Preparar el molde para esta casa
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/casa"
          cd "$RUNNER_TEMP/casa"
          supabase init --force >/dev/null
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          "$GITHUB_WORKSPACE/infra/casas/preparar.sh" "${{ steps.cual.outputs.casa }}" supabase/migrations
          ls -la supabase/migrations

      - name: Aplicar a la casa (nunca a Kash)
        run: |
          set -euo pipefail
          REF="${{ steps.cual.outputs.ref }}"
          [ "$REF" != "lsagslbkliprespbyhts" ] || { echo "::error::ALTO: Kash"; exit 1; }
          cd "$RUNNER_TEMP/casa"
          supabase link --project-ref "$REF" </dev/null
          supabase db push --linked --include-all --yes

      - name: Contar lo que quedó en la casa
        run: |
          set -euo pipefail
          REF="${{ steps.cual.outputs.ref }}"
          Q='select json_build_object(
            '"'"'tablas'"'"', (select count(*) from pg_tables where schemaname = '"'"'public'"'"'),
            '"'"'funciones'"'"', (select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = '"'"'public'"'"'),
            '"'"'politicas'"'"', (select count(*) from pg_policies where schemaname = '"'"'public'"'"'),
            '"'"'triggers'"'"', (select count(*) from pg_trigger t join pg_class c on c.oid = t.tgrelid join pg_namespace n on n.oid = c.relnamespace where n.nspname = '"'"'public'"'"' and not t.tgisinternal),
            '"'"'baldes'"'"', (select count(*) from storage.buckets),
            '"'"'agencias'"'"', (select json_agg(name) from public.tenants)
          ) as conteo'
          curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$Q" '{query: $q, read_only: true}')"
          echo
