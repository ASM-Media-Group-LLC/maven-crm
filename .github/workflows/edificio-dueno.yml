name: Edificio · invitar al dueño de la plataforma (maven-agencias)

# LA PUERTA PRENDIDA (19/11/2026). En el EDIFICIO (maven-agencias, ezeigddgkaemxpshghmu):
#   1. Si el correo no tiene cuenta, la invita con la API de Auth (/auth/v1/invite). Le
#      llega «Te dieron acceso a Maven» con «Crear mi contraseña», que abre
#      https://app.maven-ai.me/reset-password (la pantalla de siempre para crear la clave).
#      Si ya tiene cuenta, no se le manda nada.
#   2. Lo deja como DUEÑO de la plataforma (plataforma_admins.nivel = 'dueno').
#
# NUNCA toca contraseñas: la persona crea la suya desde el correo.
# CANDADO: solo el edificio, nunca Kash (lsagslbkliprespbyhts): guarda-kash.sh antes de
# cada paso, y la llave de servicio se pide SOLO para el ref del edificio (enmascarada).
# Requiere que el árbol ya esté aplicado (workflow «Edificio · árbol…»).

on:
  workflow_dispatch:
    inputs:
      correo:
        description: 'Correo del dueño de la plataforma'
        type: string
        default: 'rusin24@gmail.com'

concurrency:
  group: edificio-dueno
  cancel-in-progress: false

env:
  EDIFICIO_REF: ezeigddgkaemxpshghmu
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  REDIRECCION: https://app.maven-ai.me/reset-password

jobs:
  dueno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Candado — solo el edificio, nunca Kash
        env:
          CORREO: ${{ github.event.inputs.correo }}
        run: |
          set -euo pipefail
          source infra/casas/guarda-kash.sh
          solo_edificio "$EDIFICIO_REF"
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          # Solo un correo simple (va dentro de SQL y de la API): sin comillas ni espacios.
          C="$(printf '%s' "$CORREO" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [[ "$C" =~ ^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$ ]] || { echo "::error::Correo no válido"; exit 1; }
          echo "CORREO_LIMPIO=$C" >> "$GITHUB_ENV"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: El árbol está aplicado (solo lectura)
        run: |
          set -euo pipefail
          source infra/casas/guarda-kash.sh
          solo_edificio "$EDIFICIO_REF"
          Q="select (to_regclass('public.organizaciones') is not null and exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = 'plataforma_admins' and column_name = 'nivel')) as listo"
          L="$(curl -sS -f -X POST "https://api.supabase.com/v1/projects/$EDIFICIO_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$Q" '{query: $q, read_only: true}')" | jq -r '.[0].listo')"
          [ "$L" = "true" ] || { echo "::error::El árbol no está aplicado en el edificio: corre primero «Edificio · árbol…» con aplicar"; exit 1; }

      - name: Invitar (si no tiene cuenta) y dejarlo como dueño
        run: |
          set -euo pipefail
          source infra/casas/guarda-kash.sh
          solo_edificio "$EDIFICIO_REF"
          API="https://api.supabase.com/v1/projects/$EDIFICIO_REF/database/query"
          H=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          C="$CORREO_LIMPIO"

          existe() {
            local q="select count(*)::int as n from auth.users where lower(email) = '$C'"
            curl -sS -f -X POST "$API" "${H[@]}" -d "$(jq -n --arg q "$q" '{query: $q, read_only: true}')" | jq -r '.[0].n'
          }

          if [ "$(existe)" = "0" ]; then
            # La llave de servicio del EDIFICIO (nunca la de Kash), enmascarada y sin imprimir.
            SERVICIO="$(supabase projects api-keys --project-ref "$EDIFICIO_REF" -o json | jq -r '.[] | select(.name == "service_role" or .type == "secret") | .api_key' | head -1)"
            [ -n "$SERVICIO" ] && [ "$SERVICIO" != "null" ] || { echo "::error::No se pudo leer la llave de servicio del edificio"; exit 1; }
            echo "::add-mask::$SERVICIO"
            BASE="https://$EDIFICIO_REF.supabase.co"
            no_es_kash "$BASE"
            DESTINO="$(jq -rn --arg u "$REDIRECCION" '$u | @uri')"
            CODIGO="$(curl -sS -o "$RUNNER_TEMP/invite.json" -w '%{http_code}' -X POST "$BASE/auth/v1/invite?redirect_to=$DESTINO" \
              -H "apikey: $SERVICIO" -H "Authorization: Bearer $SERVICIO" -H "Content-Type: application/json" \
              -d "$(jq -n --arg e "$C" '{email: $e, data: {origen: "plataforma", nivel: "dueno"}}')")"
            if [ "$CODIGO" -ge 300 ]; then
              echo "::error::La invitación no salió ($CODIGO): $(jq -r '.msg // .error_description // .message // "sin detalle"' "$RUNNER_TEMP/invite.json")"
              rm -f "$RUNNER_TEMP/invite.json"; exit 1
            fi
            rm -f "$RUNNER_TEMP/invite.json"
            echo "Invitación mandada (llega «Te dieron acceso a Maven» → Crear mi contraseña)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Ya tenía cuenta en el edificio: no se manda correo." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          Q="insert into public.plataforma_admins (user_id, nivel)
             select id, 'dueno' from auth.users where lower(email) = '$C'
             on conflict (user_id) do update set nivel = 'dueno'
             returning nivel"
          R="$(curl -sS -f -X POST "$API" "${H[@]}" -d "$(jq -n --arg q "$Q" '{query: $q}')")"
          [ "$(echo "$R" | jq -r '.[0].nivel // empty')" = "dueno" ] || { echo "::error::No quedó como dueño: $R"; exit 1; }
          echo "Queda como dueño de la plataforma." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dueños de la plataforma (solo lectura)
        run: |
          set -euo pipefail
          Q="select coalesce(json_agg(json_build_object('correo', u.email, 'nivel', pa.nivel, 'entro', u.last_sign_in_at is not null)), '[]'::json) as equipo
             from public.plataforma_admins pa join auth.users u on u.id = pa.user_id"
          curl -sS -X POST "https://api.supabase.com/v1/projects/$EDIFICIO_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$Q" '{query: $q, read_only: true}')" | tee -a "$GITHUB_STEP_SUMMARY"
