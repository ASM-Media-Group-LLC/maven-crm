name: Deploy Edge Functions

# Auto-deploy de las Edge Functions de Supabase al mergear a `main`.
#
# POR QUÉ EXISTE: los edge se deployaban A MANO (`supabase functions deploy`),
# así que prod quedaba stale si alguien olvidaba deployar o deployaba desde un
# worktree viejo. Eso causó, p.ej., que whatsapp-agent corriera lógica vieja
# de overdue (María "53 vencidas") aunque el fix ya estaba en main.
#
# verify_jwt: NO se pasa --no-verify-jwt. El valor sale de supabase/config.toml
# ([functions.<slug>] verify_jwt = ...), que declara EXPLÍCITAMENTE las 70
# funciones. Al crear una función nueva, agregá su entry ahí o el CLI la
# default-eará a verify_jwt=true (y las webhook/cron quedan 401).
#
# ⚠️ SETUP (una sola vez): en GitHub → Settings → Secrets and variables →
# Actions, crear el secret `SUPABASE_ACCESS_TOKEN` (Supabase → Account →
# Access Tokens). Sin él, el workflow falla sin deployar nada (no destructivo).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Forzar redeploy de TODAS las funciones'
        type: boolean
        default: false

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lsagslbkliprespbyhts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — falta SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN. Agregalo en Settings → Secrets → Actions y re-corré (workflow_dispatch)."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determinar qué deployar
        id: changes
        run: |
          set -euo pipefail
          # Forzar todo por disparo manual
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_all }}" = "true" ]; then
            echo "Disparo manual con deploy_all=true → TODAS"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Sin base de diff válida → TODAS"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" -- supabase/functions supabase/config.toml || true)"
          echo "Archivos cambiados:"; echo "$CHANGED"

          # Cambios en _shared/ o en config.toml afectan a muchas → TODAS
          if echo "$CHANGED" | grep -qE '^supabase/functions/_shared/|^supabase/config\.toml$'; then
            echo "_shared/ o config.toml cambió → TODAS"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Nombre de cada función cambiada = primer segmento tras supabase/functions/
          FUNCS="$(echo "$CHANGED" | sed -n 's#^supabase/functions/\([^/]*\)/.*#\1#p' | sort -u | grep -v '^_' | tr '\n' ' ')"
          echo "Funciones cambiadas: [$FUNCS]"
          echo "deploy_all=false" >> "$GITHUB_OUTPUT"
          echo "funcs=$FUNCS" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.deploy_all }}" = "true" ]; then
            echo "== Deploy de TODAS las funciones (verify_jwt desde config.toml) =="
            supabase functions deploy --project-ref "$PROJECT_REF"
            exit 0
          fi
          FUNCS="${{ steps.changes.outputs.funcs }}"
          if [ -z "${FUNCS// /}" ]; then
            echo "Nada que deployar (no cambió ninguna función)."
            exit 0
          fi
          FAILED=""
          for fn in $FUNCS; do
            if [ ! -f "supabase/functions/$fn/index.ts" ]; then
              echo "skip $fn (sin supabase/functions/$fn/index.ts)"; continue
            fi
            echo "== Deploy $fn =="
            if ! supabase functions deploy "$fn" --project-ref "$PROJECT_REF"; then
              echo "::error::Falló el deploy de $fn"
              FAILED="$FAILED $fn"
            fi
          done
          if [ -n "${FAILED// /}" ]; then
            echo "::error::Deploys fallidos:$FAILED"
            exit 1
          fi
