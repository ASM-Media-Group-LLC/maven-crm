name: Deploy Edge Functions

# Auto-deploy de las Edge Functions de Supabase al mergear a `main`.
#
# POR QUÉ EXISTE: los edge se deployaban A MANO (`supabase functions deploy`),
# así que prod quedaba stale si alguien olvidaba deployar o deployaba desde un
# worktree viejo. Eso causó, p.ej., que whatsapp-agent corriera lógica vieja
# de overdue (María "53 vencidas") aunque el fix ya estaba en main.
#
# verify_jwt: NO se pasa --no-verify-jwt. El valor sale de supabase/config.toml
# ([functions.<slug>] verify_jwt = ...), que declara EXPLÍCITAMENTE las 70
# funciones. Al crear una función nueva, agregá su entry ahí o el CLI la
# default-eará a verify_jwt=true (y las webhook/cron quedan 401).
#
# ⚠️ SETUP (una sola vez): en GitHub → Settings → Secrets and variables →
# Actions, crear el secret `SUPABASE_ACCESS_TOKEN` (Supabase → Account →
# Access Tokens). Sin él, el workflow falla sin deployar nada (no destructivo).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Forzar redeploy de TODAS las funciones'
        type: boolean
        default: false

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lsagslbkliprespbyhts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — falta SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN. Agregalo en Settings → Secrets → Actions y re-corré (workflow_dispatch)."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Versión PINNEADA a propósito. Con `version: latest` el action resuelve la
          # release contra la API de GitHub SIN autenticar y, cuando pega el rate limit,
          # el run muere acá ("Failed to resolve latest Supabase CLI release: rate limit
          # exceeded") ANTES de deployar nada → el merge queda verde a medias y las
          # funciones se quedan con el código viejo (pasó el 2026-07-29 con el PR #978).
          # Pinnear también hace los deploys reproducibles: la misma versión de CLI
          # siempre. Para actualizar: mirá la última en
          # https://github.com/supabase/cli/releases y subí este número.
          version: 2.110.0
        env:
          # El action igual consulta la API de GitHub para bajar el asset; con token va
          # autenticado (5000 req/h en vez de 60) y deja de ser una lotería.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinneada por la misma razón que la CLI de arriba: reproducible, y sin
          # depender de resolver "latest" contra una API externa en cada deploy.
          deno-version: 2.9.5

      # ⚠️ GUARD DE SEGURIDAD — aislamiento entre agencias del API pública.
      # public-api corre con service_role (salta la RLS): la única pared entre
      # agencias es lo que el código filtre. Este test falla si alguien agrega una
      # tabla o un endpoint sin declarar cómo aísla, si promueve un recurso a
      # "aislado" sin arreglar el dato, o si se pierde un filtro. Si falla, NO se
      # despliega nada, a propósito: prod se queda con el código anterior, que es
      # mucho mejor que desplegar una fuga de datos entre clientes.
      # Corre SIEMPRE, no solo cuando cambia public-api: un cambio en _shared/
      # también la redespliega.
      # Desde el 24/09 también cubre lo que ACTÚA COMO usuario (la sesión fabricada,
      # /me, que esos handlers nunca vean service_role) y el límite por hora.
      - name: Guard — aislamiento entre agencias
        run: deno test --allow-read --no-check supabase/functions/public-api/ supabase/functions/manage-api-keys/ supabase/functions/messenger-webhooks/

      # Mismo criterio: si la salida de los webhooks deja de bloquear lo que tiene
      # que bloquear, no se despliega nada.
      - name: Guard — salida de los webhooks
        run: deno test --allow-read supabase/functions/_shared/webhook-salida.test.ts

      - name: Determinar qué deployar
        id: changes
        run: |
          set -euo pipefail
          # Forzar todo por disparo manual
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_all }}" = "true" ]; then
            echo "Disparo manual con deploy_all=true → TODAS"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Sin base de diff válida → TODAS"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" -- supabase/functions supabase/config.toml || true)"
          echo "Archivos cambiados:"; echo "$CHANGED"

          # Cambios en _shared/ o en config.toml afectan a muchas → TODAS
          if echo "$CHANGED" | grep -qE '^supabase/functions/_shared/|^supabase/config\.toml$'; then
            echo "_shared/ o config.toml cambió → TODAS"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Nombre de cada función cambiada = primer segmento tras supabase/functions/
          #
          # ⚠️ El `|| true` del grep NO es cosmético. `grep` sale con 1 cuando no
          # selecciona ninguna línea, y con `set -euo pipefail` eso tiraba el paso
          # entero justo en el caso "no hay nada que desplegar": un diff sin
          # funciones (solo cambió este workflow) o con solo carpetas `_` que no
          # son `_shared` (p. ej. `_tests/`). Estuvo roto desde siempre y nadie lo
          # vio porque casi nunca cambia el workflow solo; salió al mergear #1935
          # con un "Run failed" falso y sin desplegar nada.
          FUNCS="$(echo "$CHANGED" | sed -n 's#^supabase/functions/\([^/]*\)/.*#\1#p' | sort -u | { grep -v '^_' || true; } | tr '\n' ' ')"

          # IMPORTS CRUZADOS: el bundle de una función lleva una COPIA de lo que importa
          # de otra carpeta. Si cambia la carpeta importada, hay que redesplegar también
          # a las que la importan; si no, siguen corriendo el código viejo. La tabla la
          # verifica messenger-webhooks/estructura.test.ts: un import cruzado nuevo sin
          # su regla acá rompe el guard.
          #   public-api/        → messenger-webhooks (el feed como la persona) y
          #                        manage-api-keys (vía _shared/webhook-salida.ts)
          #   parrilla-generate/ → parrilla-weekly
          # (here-string y no `echo | grep -q`: con pipefail, un SIGPIPE del echo haría
          # que el if diera falso y la regla no se aplicara)
          if grep -q '^supabase/functions/public-api/' <<< "$CHANGED"; then FUNCS="$FUNCS messenger-webhooks manage-api-keys"; fi
          if grep -q '^supabase/functions/parrilla-generate/' <<< "$CHANGED"; then FUNCS="$FUNCS parrilla-weekly"; fi
          FUNCS="$(echo $FUNCS | tr ' ' '\n' | sort -u | { grep -v '^$' || true; } | tr '\n' ' ')"
          echo "Funciones cambiadas: [$FUNCS]"
          echo "deploy_all=false" >> "$GITHUB_OUTPUT"
          echo "funcs=$FUNCS" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: |
          set -uo pipefail
          if [ "${{ steps.changes.outputs.deploy_all }}" = "true" ]; then
            echo "== Deploy de TODAS las funciones con source local =="
            # Enumeramos los dirs locales (NO 'supabase functions deploy' bare: ese
            # itera config.toml e intenta funciones sin source en el repo, ej.
            # wa-instance-manage, y aborta). Saltamos dirs que empiezan con '_'.
            FUNCS=""
            for d in supabase/functions/*/; do
              fn="$(basename "$d")"
              case "$fn" in _*) continue;; esac
              [ -f "$d/index.ts" ] && FUNCS="$FUNCS $fn"
            done
          else
            FUNCS="${{ steps.changes.outputs.funcs }}"
          fi
          if [ -z "${FUNCS// /}" ]; then
            echo "Nada que deployar (no cambió ninguna función)."
            exit 0
          fi
          echo "Funciones a deployar:$FUNCS"

          # ⚠️ REINTENTO ante fallas pasajeras del runner. El 24/09 (PR #1912)
          # `manage-api-keys` murió con "failed to bundle function: exit 125":
          # Docker no pudo arrancar el contenedor que empaqueta la función. No
          # era el código — la función siguiente bajó la misma imagen y salió
          # bien en la misma corrida —, pero el deploy quedó rojo y hubo que
          # re-ejecutarlo a mano, con prod dos minutos a medio desplegar.
          #
          # Se reintenta CUALQUIER falla, no solo el 125: una caída de la API de
          # Supabase también es pasajera, y un error de código de verdad falla
          # igual los tres intentos y se reporta como antes. Redesplegar la
          # misma función es idempotente.
          #
          # Si sale en el 2º o 3º intento queda un ::warning:: en el resumen:
          # la inestabilidad tiene que VERSE aunque el deploy termine verde.
          deploy_con_reintento() {
            local fn="$1" intento espera
            for intento in 1 2 3; do
              if supabase functions deploy "$fn" --project-ref "$PROJECT_REF"; then
                if [ "$intento" -gt 1 ]; then
                  echo "::warning::$fn se desplegó en el intento $intento (hubo una falla pasajera antes)"
                fi
                return 0
              fi
              if [ "$intento" -lt 3 ]; then
                espera=$((intento * 15))
                echo "::warning::Falló el deploy de $fn (intento $intento de 3) — reintento en ${espera}s"
                sleep "$espera"
              fi
            done
            return 1
          }

          FAILED=""
          for fn in $FUNCS; do
            if [ ! -f "supabase/functions/$fn/index.ts" ]; then
              echo "skip $fn (sin supabase/functions/$fn/index.ts)"; continue
            fi
            echo "== Deploy $fn =="
            if ! deploy_con_reintento "$fn"; then
              echo "::error::Falló el deploy de $fn tras 3 intentos"
              FAILED="$FAILED $fn"
            fi
          done
          if [ -n "${FAILED// /}" ]; then
            echo "::error::Deploys fallidos:$FAILED"
            exit 1
          fi
