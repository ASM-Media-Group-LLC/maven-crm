name: Edificio · árbol, cobros y quién soy (maven-agencias)

# LA PUERTA PRENDIDA (19/11/2026). Aplica al EDIFICIO (maven-agencias,
# ezeigddgkaemxpshghmu) las migraciones propias del edificio que viven en
# infra/edificio/migraciones/*.sql (árbol, funciones del árbol, cobros, quién soy),
# en orden de nombre. Son SOLO del edificio: no están en supabase/migrations (Kash).
#
# CANDADO: la base está escrita aquí (EDIFICIO_REF) y se comprueba antes de cada paso
# que sea exactamente el edificio y nunca Kash (lsagslbkliprespbyhts), con
# infra/casas/guarda-kash.sh (solo_edificio). Además, cada migración se niega a correr si
# encuentra el tenant de Kash. Este workflow NO lee ni escribe nada de Kash.
#
# Siempre hace primero el ENSAYO: un Postgres vacío en el runner con el molde + TODO el
# set «al día» (lo mismo que tiene el edificio) y después cada migración del árbol, una
# por una, en una transacción. Solo si el ensayo sale limpio y se dispara con «aplicar»,
# sube al edificio las que todavía no tiene (cada una en su transacción y anotada en
# supabase_migrations.schema_migrations, como lo haría el MCP).

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Después del ensayo limpio, aplicar al edificio (si no, solo ensayo)'
        type: boolean
        default: false

concurrency:
  group: edificio-arbol
  cancel-in-progress: false

env:
  EDIFICIO_REF: ezeigddgkaemxpshghmu
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  ensayo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      limpio: ${{ steps.ensayo.outputs.limpio }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Candado — solo el edificio, nunca Kash
        run: |
          set -euo pipefail
          source infra/casas/guarda-kash.sh
          solo_edificio "$EDIFICIO_REF"
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          ls infra/edificio/migraciones/*.sql >/dev/null

      - name: Qué tiene ya el edificio (solo lectura)
        run: |
          set -euo pipefail
          source infra/casas/guarda-kash.sh
          solo_edificio "$EDIFICIO_REF"
          Q="select coalesce(json_agg(version order by version), '[]'::json) as v from supabase_migrations.schema_migrations"
          curl -sS -f -X POST "https://api.supabase.com/v1/projects/$EDIFICIO_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$Q" '{query: $q, read_only: true}')" \
            | jq -r '.[0].v[]' > "$RUNNER_TEMP/ya-aplicadas.txt"
          echo "Versiones en el edificio: $(wc -l < "$RUNNER_TEMP/ya-aplicadas.txt")"
          for f in infra/edificio/migraciones/*.sql; do
            v="$(basename "$f" | cut -d_ -f1)"
            if grep -qx "$v" "$RUNNER_TEMP/ya-aplicadas.txt"; then echo "  ya está: $(basename "$f")"; else echo "  falta:   $(basename "$f")"; fi
          done

      - name: Preparar molde y el set «al día» completo
        run: |
          set -euo pipefail
          infra/casas/preparar.sh agencias "$RUNNER_TEMP/molde"
          # Sin versiones ya aplicadas: el Postgres del ensayo está vacío y necesita todo.
          : > "$RUNNER_TEMP/nada.txt"
          infra/casas/al-dia.sh agencias "$RUNNER_TEMP/al-dia/migraciones" "$RUNNER_TEMP/nada.txt"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Levantar un Postgres vacío (local del runner)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local" && cd "$RUNNER_TEMP/local"
          supabase init --force >/dev/null
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          supabase db start

      - name: Ensayo — molde + al día + árbol, una por una
        id: ensayo
        run: |
          set -uo pipefail
          URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          R="$RUNNER_TEMP/ensayo-arbol.md"
          psql "$URL" -q -c "create extension if not exists pg_cron; create extension if not exists pg_net;" >/dev/null 2>&1 || true
          for f in "$RUNNER_TEMP"/molde/*.sql; do
            psql "$URL" -v ON_ERROR_STOP=0 -q -f "$f" > /dev/null 2>> "$RUNNER_TEMP/errores-base.txt" || true
          done
          for f in "$RUNNER_TEMP"/al-dia/migraciones/*.sql; do
            psql "$URL" -v ON_ERROR_STOP=1 -1 -q -f "$f" > /dev/null 2>> "$RUNNER_TEMP/errores-base.txt" || true
          done
          {
            echo "## Ensayo del árbol en un Postgres vacío"
            echo ""
            echo "Errores al levantar la base (molde + al día, referencia): $(grep -c 'ERROR' "$RUNNER_TEMP/errores-base.txt" || true)"
            echo ""
            echo "| Migración del edificio | Resultado |"
            echo "|---|---|"
          } > "$R"
          malas=0
          for f in infra/edificio/migraciones/*.sql; do
            b="$(basename "$f")"
            if salida="$(psql "$URL" -v ON_ERROR_STOP=1 -1 -q -f "$f" 2>&1 >/dev/null)"; then
              echo "| $b | entra |" >> "$R"
            else
              malas=$((malas + 1))
              err="$(echo "$salida" | grep -m1 ERROR | tr '|' '/' | cut -c1-220)"
              echo "| $b | **falla**: $err |" >> "$R"
            fi
          done
          echo "" >> "$R"
          psql "$URL" -At >> "$R" <<'SQL'
          select 'Funciones del panel: ' || string_agg(proname, ', ' order by proname) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
           where n.nspname = 'public' and proname in ('quien_soy_en_la_plataforma', 'equipo_de_maven', 'organizaciones_del_dueno', 'resumen_organizacion');
          SQL
          cat "$R" >> "$GITHUB_STEP_SUMMARY"
          cat "$R"
          if [ "$malas" -eq 0 ]; then echo "limpio=true" >> "$GITHUB_OUTPUT"; else echo "limpio=false" >> "$GITHUB_OUTPUT"; fi
          echo "Migraciones del árbol que fallan en el ensayo: $malas"

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edificio-arbol
          path: |
            ${{ runner.temp }}/ensayo-arbol.md
            ${{ runner.temp }}/errores-base.txt
          retention-days: 14

  aplicar:
    needs: ensayo
    if: github.event_name == 'workflow_dispatch' && inputs.aplicar && needs.ensayo.outputs.limpio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar al edificio lo que falta (nunca a Kash)
        run: |
          set -euo pipefail
          source infra/casas/guarda-kash.sh
          solo_edificio "$EDIFICIO_REF"
          API="https://api.supabase.com/v1/projects/$EDIFICIO_REF/database/query"
          H=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          Q="select coalesce(json_agg(version order by version), '[]'::json) as v from supabase_migrations.schema_migrations"
          curl -sS -f -X POST "$API" "${H[@]}" -d "$(jq -n --arg q "$Q" '{query: $q, read_only: true}')" \
            | jq -r '.[0].v[]' > "$RUNNER_TEMP/ya-aplicadas.txt"
          for f in infra/edificio/migraciones/*.sql; do
            b="$(basename "$f" .sql)"; v="${b%%_*}"; nombre="${b#*_}"
            if grep -qx "$v" "$RUNNER_TEMP/ya-aplicadas.txt"; then echo "ya estaba: $b" | tee -a "$GITHUB_STEP_SUMMARY"; continue; fi
            solo_edificio "$EDIFICIO_REF"
            [[ "$v" =~ ^[0-9]{14}$ && "$nombre" =~ ^[a-z0-9_]+$ ]] || { echo "::error::nombre raro: $b"; exit 1; }
            # La migración y su anotación, en UNA transacción: o entra entera o no entra nada.
            COLA="insert into supabase_migrations.schema_migrations (version, name) values ('$v', '$nombre');"
            CUERPO="$(jq -n --rawfile sql "$f" --arg cola "$COLA" '{query: ("begin;\n" + $sql + "\n" + $cola + "\ncommit;")}')"
            if ! salida="$(curl -sS -f -X POST "$API" "${H[@]}" -d "$CUERPO" 2>&1)"; then
              echo "::error::$b no entró: $(echo "$salida" | head -c 400)"; exit 1
            fi
            echo "aplicada: $b" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Comprobar (solo lectura)
        run: |
          set -euo pipefail
          Q="select json_build_object(
            'quien_soy', to_regprocedure('public.quien_soy_en_la_plataforma()') is not null,
            'equipo_de_maven', to_regprocedure('public.equipo_de_maven()') is not null,
            'organizaciones', to_regclass('public.organizaciones') is not null,
            'externas', (select count(*) from public.organizaciones_externas),
            'duenos_plataforma', (select count(*) from public.plataforma_admins where nivel = 'dueno')
          ) as estado"
          curl -sS -X POST "https://api.supabase.com/v1/projects/$EDIFICIO_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$Q" '{query: $q, read_only: true}')" | tee -a "$GITHUB_STEP_SUMMARY"
