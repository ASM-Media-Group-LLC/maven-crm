<style>
/* Layout: igual que Blu — lista de posiciones; al abrir una, sus 2 interruptores + tablas Menús | Funciones | Datos por sección */
:root{--bg:#f3f4f8;--card:#fff;--fg:#161a26;--muted:#5d6478;--line:#dfe2ec;--accent:#6d4cdb;--soft:#ece7fd;--new:#b26a00;--newsoft:#fdf1dc;--ok:#1d8a55;
 --display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f121b;--card:#171b27;--fg:#e8eaf2;--muted:#9aa1b5;--line:#262b3b;--accent:#a48cff;--soft:#251f45;--new:#f0b04a;--newsoft:#2e2412;--ok:#4fd08f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f121b;--card:#171b27;--fg:#e8eaf2;--muted:#9aa1b5;--line:#262b3b;--accent:#a48cff;--soft:#251f45;--new:#f0b04a;--newsoft:#2e2412;--ok:#4fd08f;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.8rem}.lead{color:var(--muted);margin:4px 0 0;max-width:75ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
button.set{font:inherit;font-size:.82rem;background:var(--soft);color:var(--accent);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button.set:focus-visible,button.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.back{font:inherit;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.info{background:var(--soft);color:var(--accent);border-radius:10px;padding:10px 14px;font-size:.85rem}
.sw{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.sw p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.box{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;flex:none;display:inline-grid;place-items:center;margin-top:2px}
.box.on{background:var(--accent);border-color:var(--accent)}
.box.on::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.fn{display:inline-flex;gap:6px;align-items:center;margin:2px 14px 2px 0;font-size:.84rem}
.fn.off{color:var(--muted)}
.nuevo{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;background:var(--newsoft);color:var(--new);border-radius:4px;padding:0 5px}
.grp td{background:var(--bg);font-weight:600}
.menu{display:flex;gap:8px;align-items:flex-start}
.radio{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.radio span{display:flex;gap:6px;align-items:center}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.dot.on{border:4px solid var(--accent)}
.radio .sel{color:var(--fg)}
h2.sec{font-size:1.1rem;margin-top:8px}
.nota{font-size:.84rem;color:var(--new);background:var(--newsoft);border-radius:10px;padding:10px 14px}
.persona td:first-child{font-weight:600}
.leg{font-size:.82rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
@media (max-width:640px){td,th{padding:8px 10px}}
</style>

function permisos(i){
 const p=D.pos[i];
 let h=`<div class="head"><div><h1>Permisos de ${esc(p.n)}</h1><p class="lead">${p.g.map(esc).join(" · ")}</p></div><button class="back" id="back">← Volver</button></div>
 <div class="info">Igual que en Blu, los cambios se guardan solos con cada check. <span class="nuevo">nuevo</span> = función que hoy está escondida en el código y pasa a tener su propio check.</div>
 ${p.nota?`<div class="nota">${esc(p.nota)}</div>`:""}
 <div class="sw">${box(p.full)}<div><b>Acceso total (Admin)</b><p>Da todos los permisos de una vez, incluidos los que se agreguen después. Mientras está prendido, lo de abajo no cuenta.</p></div></div>
 <div class="sw">${box(p.allc)}<div><b>Acceso a todas las creadoras</b><p>Ve todas las creadoras de hoy y las futuras, sin asignarlas una por una.</p></div></div>`;
 for(const [sec,groups] of D.cat){
  h+=`<h2 class="sec">${esc(sec)}</h2><div class="panel tbl"><table><thead><tr><th style="width:26%">Menús</th><th>Funciones</th><th style="width:190px">Datos</th></tr></thead><tbody>`;
  for(const [g,rows] of groups){
   const anyG=rows.some(([r,fs])=>fs.some(f=>p.on[f[0]]));
   h+=`<tr class="grp"><td colspan="3"><span class="menu">${box(anyG)} ${esc(g)}</span></td></tr>`;
   for(const [r,fs,dat] of rows){
    const any=fs.some(f=>p.on[f[0]]);
    const s=p.full?"all":(p.sc[r]||"all");
    const datos=dat==="no"?`<span style="color:var(--muted);font-size:.8rem">Datos de la empresa</span>`:`<div class="radio">${["all","subordinates","self"].map(k=>`<span class="${any&&k===s?"sel":""}"><span class="dot${any&&k===s?" on":""}"></span>${SC[k]}</span>`).join("")}</div>`;
    h+=`<tr><td><span class="menu" style="padding-left:18px">${box(any)} ${esc(r)}</span></td><td>${fs.map(([k,l,n])=>`<span class="fn${p.on[k]?"":" off"}">${box(p.on[k])}${esc(l)}${n?' <span class="nuevo">nuevo</span>':""}</span>`).join("")}</td><td>${datos}</td></tr>`;
   }
  }
  h+=`</tbody></table></div>`;
 }
 return h;
}
const app=document.getElementById("app");
function show(){const m=location.hash.match(/^#p(\d+)$/);app.innerHTML=m&&D.pos[+m[1]]?permisos(+m[1]):lista();window.scrollTo(0,0);}
app.addEventListener("click",e=>{const b=e.target.closest("button.set");if(b)location.hash="p"+b.dataset.i;if(e.target.id==="back")location.hash="";});
window.addEventListener("hashchange",show);show();
</script>
