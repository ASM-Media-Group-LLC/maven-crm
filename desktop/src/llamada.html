<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font: 14px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; }
  .tarjeta { height: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #162033; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; -webkit-app-region: drag; }
  .foto { flex: none; width: 48px; height: 48px; border-radius: 50%; background: #bed161; color: #1c2108; display: grid; place-items: center; font-weight: 700; font-size: 20px; overflow: hidden; animation: late 1.4s ease-in-out infinite; }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes late { 0%,100% { box-shadow: 0 0 0 0 rgba(190,209,97,.55); } 50% { box-shadow: 0 0 0 8px rgba(190,209,97,0); } }
  .texto { flex: 1; min-width: 0; }
  .nombre { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detalle { color: #8f9ab0; font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .botones { display: flex; gap: 8px; -webkit-app-region: no-drag; }
  button { width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; }
  button svg { width: 20px; height: 20px; }
  .no { background: #e5484d; color: #fff; }
  .si { background: #3dd68c; color: #0b2a1a; }
  button:hover { filter: brightness(1.1); }
  @media (prefers-reduced-motion: reduce) { .foto { animation: none; } }
</style>
</head>
<body>
<div class="tarjeta">
  <div class="foto" id="foto"></div>
  <div class="texto"><div class="nombre" id="nombre"></div><div class="detalle" id="detalle"></div></div>
  <div class="botones">
    <button class="no" id="no" title="Rechazar" aria-label="Rechazar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.4 2.1L9 10.9"/><line x1="22" y1="2" x2="2" y2="22"/></svg>
    </button>
    <button class="si" id="si" title="Contestar" aria-label="Contestar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
    </button>
  </div>
</div>
<script>
  const d = window.llamada.datos;
  document.getElementById("nombre").textContent = d.nombre;
  document.getElementById("detalle").textContent = d.detalle;
  const f = document.getElementById("foto");
  if (d.foto) { const i = new Image(); i.src = d.foto; i.alt = ""; i.onerror = () => { f.textContent = (d.nombre || "?").trim().charAt(0).toUpperCase(); }; f.appendChild(i); }
  else f.textContent = (d.nombre || "?").trim().charAt(0).toUpperCase();
  document.getElementById("si").onclick = () => window.llamada.responder("contestar");
  document.getElementById("no").onclick = () => window.llamada.responder("rechazar");
</script>
</body>
</html>
