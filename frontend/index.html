<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <title>MAVEN CRM for Creators&#39; agency</title>
    <meta name="description" content="All in one platform for Creators&#39; management">
    <meta name="author" content="MAVEN" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MAVEN CRM for Creators&#39; agency">
    <meta property="og:description" content="All in one platform for Creators&#39; management">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MAVEN CRM for Creators&#39; agency">
    <meta name="twitter:description" content="All in one platform for Creators&#39; management">
</head>

  <body>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        background: #0b0b15;
        z-index: 9999;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
      }
      #boot-loader-logo {
        font-size: clamp(56px, 10vw, 112px);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1;
        user-select: none;
        margin: 0;
        display: inline-flex;
        align-items: baseline;
        gap: 0.16em;
      }
      #boot-loader-logo .maven {
        background: linear-gradient(90deg, hsl(271, 91%, 60%), hsl(211, 100%, 55%));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
      #boot-loader-logo .crm {
        color: rgba(255, 255, 255, 0.5);
        font-weight: 300;
      }
      #boot-loader-bar {
        position: relative;
        width: 220px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      #boot-loader-bar > span {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 33%;
        border-radius: 999px;
        background: linear-gradient(90deg, hsl(271, 91%, 60%), hsl(211, 100%, 55%));
        animation: boot-loading-bar 1.2s ease-in-out infinite;
      }
      @keyframes boot-loading-bar {
        0%   { transform: translateX(-100%); }
        50%  { transform: translateX(240%); }
        100% { transform: translateX(240%); }
      }
    </style>
    <div id="root">
      <div id="boot-loader">
        <h1 id="boot-loader-logo">
          <span class="maven">Maven</span><span class="crm">CRM</span>
        </h1>
        <div id="boot-loader-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
