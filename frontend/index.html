    <meta name="twitter:image" content="https://app.maven-ai.me/og.png" />

    <!-- Sora: fuente display del reskin (títulos y números grandes). El body
         sigue en system-ui — el texto corrido no cambia y no pagamos FOUT ahí. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap"
    />
</head>

  <body>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        background: #0b0b15;
        z-index: 9999;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
      }
      #boot-loader-logo {
        font-size: clamp(56px, 10vw, 112px);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1;
        user-select: none;
        margin: 0;
        display: inline-flex;
        align-items: baseline;
        gap: 0.16em;
      }
      #boot-loader-logo .maven {
        background: linear-gradient(90deg, hsl(271, 91%, 60%), hsl(211, 100%, 55%));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
      #boot-loader-logo .crm {
        color: rgba(255, 255, 255, 0.5);
        font-weight: 300;
      }
      #boot-loader-bar {
        position: relative;
        width: 220px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      #boot-loader-bar > span {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 33%;
        border-radius: 999px;
        background: linear-gradient(90deg, hsl(271, 91%, 60%), hsl(211, 100%, 55%));
        animation: boot-loading-bar 1.2s ease-in-out infinite;
      }
      @keyframes boot-loading-bar {
        0%   { transform: translateX(-100%); }
        50%  { transform: translateX(240%); }
        100% { transform: translateX(240%); }
      }
    </style>
    <div id="root">
      <div id="boot-loader">
        <h1 id="boot-loader-logo">
          <span class="maven">Maven</span><span class="crm">CRM</span>
        </h1>
        <div id="boot-loader-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
