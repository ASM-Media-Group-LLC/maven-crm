<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la PWA instalada en iPhone usa toda la pantalla y las
         áreas seguras (notch, barra de inicio) las respetan .pt-safe/.pb-safe.
         interactive-widget=resizes-content: en Android el teclado encoge el
         viewport y el composer del Messenger queda a la vista (iOS lo ignora). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#08080c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maven" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- `?v=`: los iconos no llevan hash en el nombre y hasta hoy se servían con
         caché de un año, así que el cambio de logo no llegaba a quien ya tenía la
         página abierta ni al iPhone al reinstalar. Subir el número al cambiarlos. -->
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <!-- Lo que ve alguien ANTES de abrir la página: la pestaña y Google (title y
         description, en español; la portada afina el <title> al montar) y la
         tarjeta que arma WhatsApp/LinkedIn al pegar el enlace (og:/twitter:, en
         inglés). Las tarjetas salen de src/lib/tarjetasDeLink.ts: esta es la de
         la plataforma, y el build escribe og-reunion.html y og-cowork.html para
         los links de reunión y de Cowork (nginx.conf). -->
    <title>Maven — Control total en tiempo real, a todo tu equipo en la oficina virtual</title>
    <meta name="description" content="Oficina virtual con chat, reuniones, correo con tu dominio y documentos, más una capa de IA que supervisa la actividad, califica el trabajo y te avisa." />
    <meta name="author" content="Maven" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maven" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://app.maven-ai.me/" />
    <meta property="og:title" content="Maven · Your whole team, in a virtual office" />
    <meta property="og:description" content="The virtual office for your team: chat, meetings, your own email, docs and tasks." />
    <meta property="og:image" content="https://app.maven-ai.me/og-plataforma.jpg?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Maven: your whole team, in a virtual office" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Maven · Your whole team, in a virtual office" />
    <meta name="twitter:description" content="The virtual office for your team: chat, meetings, your own email, docs and tasks." />
    <meta name="twitter:image" content="https://app.maven-ai.me/og-plataforma.jpg?v=3" />

    <!-- Manrope: fuente display del rediseño Aurora (títulos y números grandes).
         El body sigue en system-ui — el texto corrido no cambia y no pagamos FOUT ahí. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
    />
</head>

  <body>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        background: #08080c;
        z-index: 9999;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
      }
      #boot-loader-logo {
        font-size: clamp(56px, 10vw, 112px);
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1;
        user-select: none;
        margin: 0;
        display: inline-flex;
        align-items: baseline;
        gap: 0.16em;
      }
      #boot-loader-logo .maven {
        background: linear-gradient(90deg, hsl(202, 80%, 54%), hsl(213, 70%, 58%));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
      #boot-loader-logo .crm {
        color: rgba(255, 255, 255, 0.5);
        font-weight: 300;
      }
      #boot-loader-bar {
        position: relative;
        width: 220px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      #boot-loader-bar > span {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 33%;
        border-radius: 999px;
        background: linear-gradient(90deg, hsl(202, 80%, 54%), hsl(213, 70%, 58%));
        animation: boot-loading-bar 1.2s ease-in-out infinite;
      }
      @keyframes boot-loading-bar {
        0%   { transform: translateX(-100%); }
        50%  { transform: translateX(240%); }
        100% { transform: translateX(240%); }
      }
    </style>
    <div id="root">
      <div id="boot-loader">
        <h1 id="boot-loader-logo">
          <span class="maven">Maven</span><span class="crm">CRM</span>
        </h1>
        <div id="boot-loader-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
