server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — every unknown path falls back to index.html
  # so React Router can handle it client-side
  location / {
    try_files $uri $uri/ /index.html;
  }

  # El service worker y el manifest NUNCA con caché larga. El navegador
  # respeta Cache-Control para lo que el SW importa (sw-push.js) hasta 24 h:
  # con el bloque de abajo, un deploy que cambie los avisos push tardaría un
  # día en llegar a los teléfonos. Va ANTES del regex de estáticos porque nginx
  # toma el primer `location ~` que matchea.
  location ~* ^/(sw\.js|sw-push\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Los iconos de la marca NO llevan hash en el nombre, así que con la caché de
  # un año de abajo un cambio de logo no llegaba NUNCA: el 10/09/2026 la M nueva
  # ya estaba en el servidor y el iPhone seguía instalando la vieja. Una hora y
  # revalidando. Va ANTES del regex de estáticos: nginx toma el primer `location
  # ~` que matchea. Solo add_header (sin `expires`) para no mandar dos
  # Cache-Control, como pasa en el bloque de abajo.
  location ~* ^/(favicon\.ico|icon-192\.png|icon-512\.png|apple-touch-icon\.png|og\.png|og-[a-z]+\.jpg)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
  }

  # ⚠️ Los .mjs se servían como `application/octet-stream` y el navegador se
  # NIEGA a ejecutar un módulo con ese tipo: el `import()` del worker de pdf.js
  # moría con "Failed to fetch dynamically imported module" y NINGÚN PDF del
  # correo se podía ver (17/09/2026). El archivo estaba y daba 200 — lo que
  # estaba mal era el tipo.
  #
  # Son dos cosas juntas: esta versión de nginx no trae `.mjs` en su mime.types,
  # y el regex de estáticos de abajo tampoco lo agarra, porque ".mjs" no termina
  # en ".js". Así que caía al `location /`, sin tipo y sin caché.
  #
  # Va ANTES del regex de estáticos: nginx toma el primer `location ~` que
  # matchea. `default_type` y no un bloque `types`, que reemplazaría el mapa
  # entero heredado en vez de sumarle una extensión.
  location ~* \.mjs$ {
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Long cache for hashed assets produced by Vite
  # .wasm incluido (16/11/2026): el filtro de ruido DeepFilterNet pesa ~12 MB y
  # sin esto el navegador lo volvía a pedir; el nombre lleva hash como el resto.
  # Los mapas de fuente nunca se sirven (el Dockerfile ni los copia; esto es por
  # si alguien publica un dist armado a mano). Ver vite.config.ts, sourcemap.
  location ~* \.map$ {
    return 404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # La tarjeta de WhatsApp de cada tipo de link (frontend/src/lib/tarjetasDeLink.ts):
  # WhatsApp no corre JavaScript, lee las <meta og:…> del HTML que manda el
  # servidor. Una invitación a reunión (/entrar/<código>) y un link de Cowork
  # (/cowork?…) reciben su propia copia de index.html con su tarjeta; la app que
  # arranca es la misma. Sin caché, igual que index.html.
  location ^~ /entrar/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /og-reunion.html =404;
  }
  location = /cowork {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /og-cowork.html =404;
  }

  # No cache for the entry point so deploys are picked up immediately
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Standard hardening
  server_tokens off;
  client_max_body_size 25m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
}
