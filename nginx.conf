server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — every unknown path falls back to index.html
  # so React Router can handle it client-side
  location / {
    try_files $uri $uri/ /index.html;
  }

  # El service worker y el manifest NUNCA con caché larga. El navegador
  # respeta Cache-Control para lo que el SW importa (sw-push.js) hasta 24 h:
  # con el bloque de abajo, un deploy que cambie los avisos push tardaría un
  # día en llegar a los teléfonos. Va ANTES del regex de estáticos porque nginx
  # toma el primer `location ~` que matchea.
  location ~* ^/(sw\.js|sw-push\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Long cache for hashed assets produced by Vite
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # No cache for the entry point so deploys are picked up immediately
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Standard hardening
  server_tokens off;
  client_max_body_size 25m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
}
